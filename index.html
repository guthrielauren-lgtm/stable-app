<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Stable</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@500;700&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');
  :root{
    --barn-green:#1F2E23; --sage:#3D5A42; --chalk:#F6F3EA; --paper:#D4CBB3;
    --brass:#B5824A; --red:#8C2F2F; --ink:#3a3527;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%; background:#0f1512; font-family:'Archivo',sans-serif; color:var(--ink);}
  button{font-family:inherit; cursor:pointer;}
  input,textarea,select{font-family:inherit; font-size:14px;}
  #app{max-width:460px; margin:0 auto; background:var(--chalk); min-height:100vh; display:flex; flex-direction:column; position:relative;}
  .topbar{background:var(--barn-green); color:var(--chalk); padding:18px 18px 14px; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:5;}
  .brand{font-family:'Roboto Slab',serif; font-weight:700; font-size:20px;}
  .brand span{color:var(--brass);}
  .topbar .sub{font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--paper); opacity:.85;}
  .screen{flex:1; padding:16px 16px 100px;}
  .section-label{font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--sage); margin:22px 2px 10px; font-weight:600; display:flex; justify-content:space-between; align-items:center;}
  .section-label:first-child{margin-top:0;}
  .section-label .add-link{font-size:11px; color:var(--brass); cursor:pointer;}

  .stall-card{background:var(--barn-green); border-radius:6px; margin-bottom:14px; overflow:hidden; border:1px solid #0c1410; position:relative; cursor:pointer;}
  .stall-tag{position:absolute; top:12px; right:-1px; color:var(--barn-green); font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:700; letter-spacing:1px; padding:4px 10px 4px 12px; border-radius:4px 0 0 4px; text-transform:uppercase;}
  .stall-photo{height:110px; background-size:cover; background-position:center; display:flex; align-items:center; justify-content:center; color:rgba(246,243,234,.35); font-family:'JetBrains Mono',monospace; font-size:11px;}
  .stall-body{padding:14px 16px 16px;}
  .stall-name{font-family:'Roboto Slab',serif; font-weight:700; font-size:18px; color:var(--chalk); margin:0 0 2px;}
  .stall-sub{font-size:12px; color:var(--paper); opacity:.75; margin-bottom:12px;}
  .nameplate-row{display:flex; gap:10px; border-top:1px solid rgba(246,243,234,.12); padding-top:10px;}
  .nameplate-item{flex:1; min-width:0;}
  .nameplate-label{font-family:'JetBrains Mono',monospace; font-size:9px; text-transform:uppercase; letter-spacing:1px; color:var(--brass); margin-bottom:3px;}
  .nameplate-val{font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--chalk); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .nameplate-val.alert{color:#e2a15a;}

  .quick-row{display:flex; gap:8px; margin-bottom:4px;}
  .quick-btn{flex:1; background:var(--paper); border-radius:6px; padding:12px 6px; text-align:center; border:1px solid #c4b998;}
  .quick-icon{font-size:18px; margin-bottom:4px; display:block;}
  .quick-label{font-weight:600; font-size:10.5px; color:var(--barn-green);}

  .card{background:#fff; border:1px solid var(--paper); border-radius:6px; padding:14px 16px; margin-bottom:10px;}
  .row{display:flex; justify-content:space-between; align-items:center;}
  .name{font-weight:600; font-size:13.5px;}
  .sub{font-family:'JetBrains Mono',monospace; font-size:10.5px; color:#8a8060; margin-top:2px;}
  .pill{font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:600; padding:3px 9px; border-radius:20px; white-space:nowrap;}
  .pill.ok{background:#e3ead9; color:var(--sage);}
  .pill.low{background:#f2ded4; color:var(--red);}
  .pill.neutral{background:var(--chalk); color:var(--sage); border:1px solid var(--paper);}

  .report-title{font-family:'Roboto Slab',serif; font-weight:700; font-size:14.5px; color:var(--barn-green);}
  .report-date{font-family:'JetBrains Mono',monospace; font-size:10px; color:#8a8060;}
  .report-body{font-size:12.5px; line-height:1.6; color:var(--ink); white-space:pre-wrap;}
  .tag-row{display:flex; gap:6px; margin-top:10px; flex-wrap:wrap;}
  .tag{font-family:'JetBrains Mono',monospace; font-size:9.5px; background:var(--chalk); border:1px solid var(--paper); padding:3px 8px; border-radius:20px; color:var(--sage); cursor:pointer;}

  .tabbar{position:sticky; bottom:0; background:var(--barn-green); display:flex; padding:9px 4px 14px; border-top:1px solid #0c1410;}
  .tab{flex:1; text-align:center; color:rgba(246,243,234,.5); background:none; border:none; padding:4px 0;}
  .tab.active{color:var(--brass);}
  .tab-icon{font-size:17px; display:block; margin-bottom:2px;}
  .tab-label{font-family:'JetBrains Mono',monospace; font-size:8.5px; text-transform:uppercase; letter-spacing:.5px;}

  .btn{display:inline-block; padding:10px 16px; border-radius:6px; border:none; font-weight:600; font-size:13px;}
  .btn-primary{background:var(--barn-green); color:var(--chalk); width:100%;}
  .btn-secondary{background:var(--paper); color:var(--barn-green); width:100%;}
  .btn-danger{background:var(--red); color:#fff;}
  .btn-sm{padding:6px 10px; font-size:11.5px; border-radius:5px; border:1px solid var(--paper); background:#fff; color:var(--barn-green);}
  .btn-row{display:flex; gap:8px; margin-top:10px;}

  label{display:block; font-family:'JetBrains Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:.8px; color:var(--sage); margin:12px 0 5px;}
  input[type=text],input[type=number],input[type=date],input[type=email],input[type=tel],textarea,select{
    width:100%; padding:9px 11px; border:1px solid var(--paper); border-radius:5px; background:#fff; color:var(--ink);
  }
  textarea{min-height:70px; resize:vertical;}
  .field-row{display:flex; gap:8px;}
  .field-row>div{flex:1;}

  .modal-overlay{position:fixed; inset:0; background:rgba(15,21,18,.6); z-index:50; display:flex; align-items:flex-end; justify-content:center;}
  .modal{background:var(--chalk); width:100%; max-width:460px; max-height:88vh; overflow-y:auto; border-radius:16px 16px 0 0; padding:20px 18px 28px;}
  .modal h3{font-family:'Roboto Slab',serif; margin:0 0 4px; font-size:17px; color:var(--barn-green);}
  .modal .close{position:absolute; right:16px; top:14px; background:none; border:none; font-size:20px; color:var(--sage);}
  .modal-head{position:relative;}

  .empty{text-align:center; padding:30px 10px; color:#9a927a; font-family:'JetBrains Mono',monospace; font-size:12px; line-height:1.7;}
  .timeline-item{border-left:2px solid var(--paper); padding-left:12px; margin-bottom:14px; position:relative;}
  .timeline-item::before{content:''; position:absolute; left:-5px; top:3px; width:8px; height:8px; border-radius:50%; background:var(--brass);}
  .timeline-date{font-family:'JetBrains Mono',monospace; font-size:10px; color:#8a8060;}
  .timeline-author{font-weight:600; font-size:12.5px; color:var(--barn-green); margin:2px 0 3px;}
  .timeline-content{font-size:12.5px; line-height:1.55;}

  .photo-preview{width:100%; height:160px; border-radius:6px; background-size:cover; background-position:center; background-color:var(--paper); margin-bottom:8px; display:flex; align-items:center; justify-content:center; color:#8a8060; font-family:'JetBrains Mono',monospace; font-size:11px;}
  .chart-wrap{background:#fff; border:1px solid var(--paper); border-radius:6px; padding:12px; margin-bottom:10px;}
  .link-box{background:#fff; border:1px dashed var(--brass); border-radius:6px; padding:10px; font-family:'JetBrains Mono',monospace; font-size:10.5px; word-break:break-all; color:var(--sage); margin:8px 0;}
  .banner{background:var(--sage); color:var(--chalk); padding:10px 14px; border-radius:6px; font-size:12px; margin-bottom:12px; font-weight:600;}
  .loading{opacity:.5; pointer-events:none;}
  .spinner{display:inline-block; width:14px; height:14px; border:2px solid rgba(255,255,255,.4); border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite; vertical-align:middle; margin-right:6px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .toggle{display:flex; align-items:center; gap:8px; font-size:12.5px; margin:10px 0;}
  .toggle input{width:auto;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================= STORAGE HELPERS ============================= */
let SYNC_OK = true;
function markSyncStatus(ok){ SYNC_OK = ok; const dot = document.getElementById('syncDot'); if(dot) dot.style.display = ok ? 'none' : 'inline-block'; }
async function sGet(key){
  try{ const r = await window.storage.get(key, true); return r ? JSON.parse(r.value) : null; }
  catch(e){ return null; }
}
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
async function sSet(key, val, attempt){
  attempt = attempt || 1;
  try{
    await window.storage.set(key, JSON.stringify(val), true);
    markSyncStatus(true);
    return true;
  }catch(e){
    if(attempt < 3){ await sleep(300*attempt); return sSet(key, val, attempt+1); }
    markSyncStatus(false);
    return false;
  }
}
function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtDate(d){ return new Date(d+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
function ageFromBirthDate(birthDate){
  if(!birthDate) return null;
  const b = new Date(birthDate+'T00:00:00'); const now = new Date();
  let years = now.getFullYear() - b.getFullYear();
  const hasHadBirthdayThisYear = (now.getMonth()>b.getMonth()) || (now.getMonth()===b.getMonth() && now.getDate()>=b.getDate());
  if(!hasHadBirthdayThisYear) years--;
  if(years < 1){
    let months = (now.getFullYear()-b.getFullYear())*12 + (now.getMonth()-b.getMonth());
    return months+'mo';
  }
  return years+'yo';
}
function horseSubhead(h){
  const parts = [];
  const age = ageFromBirthDate(h.birthDate);
  if(age) parts.push(age);
  if(h.heightHH) parts.push(h.heightHH+'hh');
  if(h.breed) parts.push(h.breed);
  if(h.sex) parts.push(h.sex);
  return parts.join(' \u00b7 ') || 'No profile details yet';
}
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
function nextDueInfo(hd, h, type){
  const interval = (h.careIntervals && h.careIntervals[type]) || null;
  if(!interval) return null;
  const records = (hd.vetRecords||[]).filter(r=>r.type===type).sort((a,b)=>b.date.localeCompare(a.date));
  if(records.length===0) return {status:'none', label:'No visit logged yet'};
  const last = records[0].date;
  const due = new Date(last); due.setDate(due.getDate() + interval*7);
  const dueStr = due.toISOString().slice(0,10);
  const daysOut = daysBetween(todayStr(), dueStr);
  return { status: daysOut<0 ? 'overdue' : (daysOut<=7 ? 'soon' : 'ok'), label: daysOut<0 ? `Overdue by ${Math.abs(daysOut)}d` : `Due ${fmtDate(dueStr)} (${daysOut}d)`, lastDate:last };
}

/* ============================= STATE ============================= */
let STATE = {
  horses: [],           // horses-roster
  horseData: {},         // horse-data:{id} keyed by id, lazy loaded
  inventory: {items:[], lastDebitDate: todayStr()}, // inventory
  contacts: {trainer:null, vet:null, farrier:null, bodywork:null, custom:[]}, // contacts
  requests: [],          // requests
};
let ACTIVE_TAB = 'horses';
let ACTIVE_HORSE = null;
let RESPOND_MODE = null; // {requestId}

/* ============================= SEED DATA ============================= */
function seedHorses(){
  return [
    {
      id:'quill', name:'Quill', registeredName:'Quilliam RSF', breeder:'Rio Star Farms', birthDate:'2020-06-03', heightHH:18.2, breed:'Oldenburg', sex:'Gelding', color:'', markings:'Snip, rear socks, front pastern marks', microchipNumber:'', registrationNumber:'', breeding:'Sire: Qredit; Dam: out of a Diamond-line stud mare', tagColor:'#B5824A', tagLabel:'Dressage', photo:null,
      vetContext:{allergies:'None known', conditions:'History of white line disease (monitored); presumptive gastric sensitivity, omeprazole discussed with vet', meds:'', notes:'Long-standing bond, owned since ~age 2. Under saddle with trainer Jo.'}, careIntervals:{farrier:4, vet:26, bodywork:4}
    },
    {
      id:'willow', name:'Willow', registeredName:'Willow Rose RSF', breeder:'Rio Star Farm', birthDate:'2024-06-14', heightHH:16.2, breed:'GOV (Oldenburg NA) Premium', sex:'Filly', color:'', markings:'None', microchipNumber:'', registrationNumber:'', breeding:'Sire: Fynch Hatton; Dam: Windsor Rose RSF (by Rascalino, out of Winter Willow RSF by Winterprinz)', tagColor:'#7d9a80', tagLabel:'Young Stock', photo:null,
      vetContext:{allergies:'None known', conditions:'Bilateral hind fetlock OCD surgical history — monitor growth plates and DOD risk', meds:'', notes:'Relocated Texas \u2192 Colorado. Not yet in work. From Rio Star Farm.'}, careIntervals:{farrier:4, vet:26, bodywork:4}
    }
  ];
}
function seedInventory(){
  return {
    items:[
      {id:uid(), name:'Empower Boost', unit:'lb', qtyOnHand:20, reorderDays:5},
      {id:uid(), name:'Empower Topline Balance', unit:'lb', qtyOnHand:35, reorderDays:5},
      {id:uid(), name:"Farrier's Formula Extra Strength", unit:'scoop', qtyOnHand:60, reorderDays:7},
      {id:uid(), name:'Elevate Vitamin E', unit:'scoop', qtyOnHand:40, reorderDays:5},
      {id:uid(), name:'Uckele Gut', unit:'scoop', qtyOnHand:30, reorderDays:5},
      {id:uid(), name:'Beet Pulp Shreds', unit:'lb', qtyOnHand:25, reorderDays:5},
      {id:uid(), name:'Alfalfa Pellets', unit:'lb', qtyOnHand:30, reorderDays:5},
    ],
    lastDebitDate: todayStr()
  };
}
function emptyHorseData(){
  return { feedingPlan:{AM:[], PM:[]}, medsPlan:[], skipDates:[], bcsLog:[], vetRecords:[], trainingNotes:[], aiReports:[], preparedBags:{daysRemaining:0, lastPrepDate:null}, photoLog:[], transitions:[] };
}

/* ============================= INIT / LOAD ============================= */
async function runMigrations(){
  let applied = await sGet('migrations');
  if(!applied) applied = [];
  const MIG_ID = 'willow-real-diet-and-profiles-2026-07-13';
  if(applied.includes(MIG_ID)) return;

  const quill = STATE.horses.find(h=>h.id==='quill');
  const willow = STATE.horses.find(h=>h.id==='willow');
  let rosterChanged = false;

  if(quill){
    quill.birthDate = '2020-06-03';
    quill.registeredName = quill.registeredName || 'Quilliam RSF';
    quill.breeder = quill.breeder || 'Rio Star Farms';
    quill.markings = quill.markings || 'Snip, rear socks, front pastern marks';
    rosterChanged = true;
  }
  if(willow){
    willow.birthDate = '2024-06-14';
    willow.registeredName = willow.registeredName || 'Willow Rose RSF';
    willow.breeder = willow.breeder || 'Rio Star Farm';
    willow.markings = willow.markings || 'None';
    rosterChanged = true;
  }
  if(rosterChanged) await sSet('horses-roster', STATE.horses);

  // Willow is actually still on Bryant Grain 14% Equine Energy Plus at ~8 lb/day (4 AM + 4 PM),
  // not yet on Empower Topline Balance. Correct her live feeding plan and set up the real transition,
  // starting Monday (the day after she arrives at the new barn).
  const willowHd = STATE.horseData['willow'];
  if(willowHd){
    willowHd.feedingPlan = {
      AM: [ {name:'14% Concentrate (transition)', amt:4, unit:'lb'}, {name:"Farrier's Formula Extra Strength", amt:1, unit:'scoop'} ],
      PM: [ {name:'14% Concentrate (transition)', amt:4, unit:'lb'} ]
    };
    const startDate = '2026-07-13'; // Monday
    willowHd.transitions = willowHd.transitions || [];
    willowHd.transitions.push({
      id: uid(), itemName:'Empower Topline Balance', targetAmt:2, unit:'lb', timing:'Both', weeks:3,
      startDate, startAmt:0, replaces:'14% Concentrate (transition)', replacesAmt:8, status:'active'
    });
    willowHd.transitions.push({
      id: uid(), itemName:'Elevate Vitamin E', targetAmt:1, unit:'scoop', timing:'AM', weeks:3,
      startDate, startAmt:0, replaces:null, replacesAmt:0, status:'active'
    });
    willowHd.transitions.forEach(t=>{ if(t.startDate===startDate) applyTransitionToFeedingPlan(willowHd, t); });
    await sSet('horse-data:willow', willowHd);
    STATE.horseData['willow'] = willowHd;
  }

  // Make sure Bryant Grain is tracked in backstock so the transition's ramp-down debits correctly
  if(!STATE.inventory.items.find(i=>i.name==='Bryant Grain 14% Equine Energy Plus')){
    STATE.inventory.items.push({id:uid(), name:'Bryant Grain 14% Equine Energy Plus', unit:'lb', qtyOnHand:40, reorderDays:5});
    await sSet('inventory', STATE.inventory);
  }

  applied.push(MIG_ID);
  await sSet('migrations', applied);

  // Second pass: generalize any already-saved 'Bryant Grain' references to a brand-neutral
  // '14% Concentrate (transition)' label, so switching supply sources mid-transition doesn't
  // break the name-matching that drives auto-debit.
  const MIG_ID_2 = 'willow-generic-concentrate-rename-2026-07';
  if(!applied.includes(MIG_ID_2)){
    const OLD_NAME = 'Bryant Grain 14% Equine Energy Plus';
    const NEW_NAME = '14% Concentrate (transition)';
    const wHd = STATE.horseData['willow'];
    if(wHd){
      let changed = false;
      ['AM','PM'].forEach(tm=>{
        (wHd.feedingPlan[tm]||[]).forEach(it=>{ if(it.name===OLD_NAME){ it.name = NEW_NAME; changed=true; } });
      });
      (wHd.transitions||[]).forEach(t=>{ if(t.replaces===OLD_NAME){ t.replaces = NEW_NAME; changed=true; } });
      if(changed) await sSet('horse-data:willow', wHd);
    }
    const oldInvItem = STATE.inventory.items.find(i=>i.name===OLD_NAME);
    if(oldInvItem){ oldInvItem.name = NEW_NAME; await sSet('inventory', STATE.inventory); }
    applied.push(MIG_ID_2);
    await sSet('migrations', applied);
  }

  // Third pass: log the bridge-feed decision (Nutrena SafeChoice All Life Stages chosen over
  // Purina Impact 14:6 for its closer trace-mineral match to Bryant Grain) for future reference.
  const MIG_ID_3 = 'willow-bridge-feed-note-2026-07';
  if(!applied.includes(MIG_ID_3)){
    const w = STATE.horses.find(h=>h.id==='willow');
    if(w){
      const note = 'Bridge feed for "14% Concentrate" backstock: Nutrena SafeChoice All Life Stages (Chewy) chosen over Purina Impact 14:6 — closer match to prior Bryant Grain feed on trace mineral form (both use chelated Zinc/Copper/Cobalt complexes) and includes yeast culture.';
      w.vetContext.notes = w.vetContext.notes ? w.vetContext.notes + ' | ' + note : note;
      await sSet('horses-roster', STATE.horses);
    }
    applied.push(MIG_ID_3);
    await sSet('migrations', applied);
  }
}

async function loadAll(){
  let horses = await sGet('horses-roster');
  if(!horses){ horses = seedHorses(); await sSet('horses-roster', horses); }
  STATE.horses = horses;

  let inv = await sGet('inventory');
  if(!inv){ inv = seedInventory(); await sSet('inventory', inv); }
  STATE.inventory = inv;

  let contacts = await sGet('contacts');
  if(!contacts){ contacts = {trainer:null, vet:null, farrier:null, bodywork:null, custom:[]}; await sSet('contacts', contacts); }
  STATE.contacts = contacts;

  let requests = await sGet('requests');
  if(!requests) requests = [];
  STATE.requests = requests;

  for(const h of STATE.horses){
    await sleep(80);
    let hd = await sGet('horse-data:'+h.id);
    if(!hd){
      hd = emptyHorseData();
      if(h.id==='quill'){
        hd.feedingPlan = { AM:[
            {name:'Empower Topline Balance', amt:2, unit:'lb'},
            {name:'Empower Boost', amt:0.25, unit:'lb'},
            {name:'Elevate Vitamin E', amt:1, unit:'scoop'},
            {name:"Farrier's Formula Extra Strength", amt:1, unit:'scoop'},
            {name:'Uckele Gut', amt:1, unit:'scoop'},
            {name:'Beet Pulp Shreds', amt:0.4, unit:'lb'},
            {name:'Alfalfa Pellets', amt:0.65, unit:'lb'}
          ], PM:[
            {name:'Empower Topline Balance', amt:2, unit:'lb'},
            {name:'Empower Boost', amt:0.25, unit:'lb'},
            {name:'Elevate Vitamin E', amt:1, unit:'scoop'},
            {name:"Farrier's Formula Extra Strength", amt:1, unit:'scoop'},
            {name:'Uckele Gut', amt:1, unit:'scoop'},
            {name:'Beet Pulp Shreds', amt:0.4, unit:'lb'},
            {name:'Alfalfa Pellets', amt:0.65, unit:'lb'}
          ] };
        hd.medsPlan = [];
        hd.bcsLog = [{date: todayStr(), score:5.5, weight:1500, notes:'Baseline'}];
        hd.preparedBags = {daysRemaining:3, lastPrepDate: todayStr()};
      }
      if(h.id==='willow'){
        hd.feedingPlan = { AM:[
            {name:'Empower Topline Balance', amt:1, unit:'lb'},
            {name:'Elevate Vitamin E', amt:1, unit:'scoop'},
            {name:"Farrier's Formula Extra Strength", amt:1, unit:'scoop'}
          ], PM:[
            {name:'Empower Topline Balance', amt:1, unit:'lb'}
          ] };
        hd.bcsLog = [{date: todayStr(), score:5.0, weight:1000, notes:'Baseline, growing 2yo'}];
        hd.preparedBags = {daysRemaining:5, lastPrepDate: todayStr()};
      }
      await sSet('horse-data:'+h.id, hd);
    }
    STATE.horseData[h.id] = hd;
  }

  await runMigrations();
  await runAutoDebit();
  await runTransitionUpdates();
}

/* ============================= AUTO-DEBIT ============================= */
async function runAutoDebit(){
  // Prepared bags (barn-side, ready to feed) debit by 1 day per elapsed day.
  // Raw backstock is untouched here - it only moves when Lauren explicitly preps a new batch.
  const today = todayStr();
  let horseChanged = [];
  for(const h of STATE.horses){
    const hd = STATE.horseData[h.id];
    if(!hd) continue;
    hd.preparedBags = hd.preparedBags || {daysRemaining:0, lastPrepDate:null};
    const last = hd.preparedBags.lastDebitDate || today;
    const gap = daysBetween(last, today);
    if(gap <= 0) continue;
    let debitDays = 0;
    for(let i=1;i<=gap;i++){
      const d = new Date(last); d.setDate(d.getDate()+i);
      const dStr = d.toISOString().slice(0,10);
      if(!(hd.skipDates||[]).includes(dStr)) debitDays++;
    }
    hd.preparedBags.daysRemaining = Math.max(0, +(hd.preparedBags.daysRemaining - debitDays).toFixed(2));
    hd.preparedBags.lastDebitDate = today;
    horseChanged.push(h.id);
  }
  for(const id of horseChanged) await sSet('horse-data:'+id, STATE.horseData[id]);
}

/* Prep a batch of days' worth of bags for a horse: consumes raw backstock, adds to that horse's prepared-bag count */
async function prepBags(horseId, days){
  const hd = STATE.horseData[horseId];
  const items = [...(hd.feedingPlan.AM||[]), ...(hd.feedingPlan.PM||[])];
  const needed = {};
  items.forEach(it=>{ needed[it.name] = (needed[it.name]||0) + it.amt*days; });
  const shortfalls = [];
  Object.keys(needed).forEach(name=>{
    const invItem = STATE.inventory.items.find(x=>x.name.toLowerCase()===name.toLowerCase());
    if(!invItem || invItem.qtyOnHand < needed[name]) shortfalls.push(name);
  });
  if(shortfalls.length){
    return {ok:false, shortfalls};
  }
  Object.keys(needed).forEach(name=>{
    const invItem = STATE.inventory.items.find(x=>x.name.toLowerCase()===name.toLowerCase());
    invItem.qtyOnHand = +(invItem.qtyOnHand - needed[name]).toFixed(2);
  });
  hd.preparedBags.daysRemaining = +(hd.preparedBags.daysRemaining + days).toFixed(2);
  hd.preparedBags.lastPrepDate = todayStr();
  await sSet('inventory', STATE.inventory);
  await sSet('horse-data:'+horseId, hd);
  return {ok:true};
}

function dailyUsage(itemName){
  let total = 0;
  for(const h of STATE.horses){
    const hd = STATE.horseData[h.id]; if(!hd) continue;
    const items = [...(hd.feedingPlan.AM||[]), ...(hd.feedingPlan.PM||[])];
    for(const it of items) if(it.name.toLowerCase()===itemName.toLowerCase()) total += it.amt;
  }
  return total;
}

/* ============================= PHOTO COMPRESSION ============================= */
function compressImage(file, maxDim=800, quality=0.72){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        let w=img.width, h=img.height;
        if(w>h && w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; }
        else if(h>=w && h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ============================= AI REPORT ============================= */
async function generateAIReport(horseId, photoDataUrl, qualNotes){
  const h = STATE.horses.find(x=>x.id===horseId);
  const hd = STATE.horseData[horseId];
  const recentNotes = (hd.trainingNotes||[]).slice(-5).map(n=>`- [${n.date}] ${n.author}: ${n.content}`).join('\n') || 'None';
  const recentBcs = (hd.bcsLog||[]).slice(-3).map(b=>`- [${b.date}] BCS ${b.score}/9, ${b.weight}lb, ${b.notes||''}`).join('\n') || 'None';

  const sys = `You are an experienced equine bodywork and conditioning assessor helping a horse owner track a horse's progress over time. You will be shown a photo and given context. Respond ONLY with valid JSON, no markdown fences, no preamble, in this exact shape:
{"assessment":"2-4 sentence plain-language visual + qualitative assessment, noting posture, topline, muscling, weight, and anything relevant to soundness or condition. Be specific but appropriately cautious - you are not a substitute for a vet exam.",
"trainerQuestions":["q1","q2"],
"vetQuestions":["q1"],
"farrierQuestions":["q1"],
"bodyworkQuestions":["q1"]}
Keep each question array to 1-3 sharp, specific questions only if genuinely warranted by what you see/read - do not pad with generic filler.`;

  const userText = `Horse: ${h.name} (${horseSubhead(h)})
Vet context: allergies: ${h.vetContext.allergies||'none'}; conditions: ${h.vetContext.conditions||'none'}
Owner's qualitative notes for this check-in: ${qualNotes||'(none provided)'}
Recent training notes:
${recentNotes}
Recent BCS/weight log:
${recentBcs}`;

  const content = [{type:'text', text:userText}];
  if(photoDataUrl){
    const match = photoDataUrl.match(/^data:(image\/\w+);base64,(.*)$/);
    if(match) content.unshift({type:'image', source:{type:'base64', media_type:match[1], data:match[2]}});
  }

  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      model:'claude-sonnet-4-6', max_tokens:1000, system: sys,
      messages:[{role:'user', content}]
    })
  });
  const data = await resp.json();
  const textBlocks = (data.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('\n');
  let parsed;
  try{ parsed = JSON.parse(textBlocks.replace(/```json|```/g,'').trim()); }
  catch(e){ parsed = {assessment: textBlocks || 'Could not parse AI response.', trainerQuestions:[], vetQuestions:[], farrierQuestions:[], bodyworkQuestions:[]}; }
  return parsed;
}

function renderBcsChart(log){
  if(!log || log.length===0) return '<div class="empty">No entries yet.</div>';
  const w=400,h=110,pad=24;
  const weights = log.map(l=>l.weight);
  const min=Math.min(...weights)-20, max=Math.max(...weights)+20;
  const pts = log.map((l,i)=>{
    const x = pad + (i/(Math.max(log.length-1,1)))*(w-pad*2);
    const y = h - pad - ((l.weight-min)/(max-min))*(h-pad*1.5);
    return `${x},${y}`;
  }).join(' ');
  return `<div class="chart-wrap">
    <svg viewBox="0 0 ${w} ${h}" style="width:100%; height:110px;">
      <polyline points="${pts}" fill="none" stroke="#B5824A" stroke-width="2"/>
      ${log.map((l,i)=>{ const x = pad + (i/(Math.max(log.length-1,1)))*(w-pad*2); const y = h - pad - ((l.weight-min)/(max-min))*(h-pad*1.5); return `<circle cx="${x}" cy="${y}" r="3" fill="#1F2E23"/>`; }).join('')}
    </svg>
    <div class="sub">Latest: ${log[log.length-1].weight} lb · BCS ${log[log.length-1].score}/9 (${fmtDate(log[log.length-1].date)})</div>
  </div>`;
}

/* ---- Feed Transitions (titration planner) ---- */
function computeTransitionSchedule(t){
  const weeks = [];
  for(let w=1; w<=t.weeks; w++){
    const frac = w/t.weeks;
    weeks.push({ week:w, newAmt: +(t.startAmt + (t.targetAmt-t.startAmt)*frac).toFixed(2), oldAmt: t.replaces ? +(t.replacesAmt*(1-frac)).toFixed(2) : null });
  }
  return weeks;
}
function currentTransitionWeek(t){
  const daysIn = daysBetween(t.startDate, todayStr());
  if(daysIn < 0) return 0;
  return Math.max(1, Math.min(t.weeks, Math.floor(daysIn/7)+1));
}
function renderTransitions(hd){
  const active = (hd.transitions||[]).filter(t=>t.status!=='cancelled');
  if(active.length===0) return '<div class="empty">No feed transitions in progress.</div>';
  return active.map(t=>{
    const schedule = computeTransitionSchedule(t);
    const curWeek = t.status==='complete' ? t.weeks : currentTransitionWeek(t);
    const statusLabel = t.status==='complete' ? 'Complete' : (curWeek===0 ? 'Starts '+fmtDate(t.startDate) : 'Week '+curWeek+' of '+t.weeks);
    return `
      <div class="card">
        <div class="row"><div class="name">${t.itemName}${t.replaces?' (replacing '+t.replaces+')':''}</div><div class="pill ${t.status==='complete'?'ok':'neutral'}">${statusLabel}</div></div>
        <div class="sub" style="margin-top:6px;">Target: ${t.targetAmt}${t.unit} · ${t.timing} · starts ${fmtDate(t.startDate)}</div>
        <div style="margin-top:8px; display:flex; flex-wrap:wrap; gap:6px;">
          ${schedule.map(s=>`<div class="tag" style="cursor:default; ${s.week===curWeek?'background:var(--brass); color:#fff; border-color:var(--brass);':''}">Wk${s.week}: ${s.newAmt}${t.unit}${t.replaces?' / old '+s.oldAmt:''}</div>`).join('')}
        </div>
        ${t.status!=='complete' ? `<div class="btn-row"><button class="btn-sm" data-cancel-transition="${t.id}">Cancel Transition</button></div>` : ''}
      </div>`;
  }).join('');
}
function openAddTransition(id){
  const hd = STATE.horseData[id];
  const existingItems = [...new Set([...(hd.feedingPlan.AM||[]), ...(hd.feedingPlan.PM||[])].map(i=>i.name))];
  showModal(`

    <label>New Feed Name</label><input type="text" id="tr-name">

    <select id="tr-timing"><option value="AM">AM only</option><option value="PM">PM only</option><option value="Both">Both (split evenly)</option></select>
    <label>Weeks to Ramp</label><input type="number" id="tr-weeks" value="2" min="1">
    <label>Replacing an existing item? (optional)</label>
    <select id="tr-replaces"><option value="">— None —</option>${existingItems.map(n=>`<option value="${n}">${n}</option>`).join('')}</select>
    <div class="btn-row"><button class="btn btn-primary" id="tr-save">Start Transition</button></div>
  `);
  document.getElementById('tr-save').addEventListener('click', async ()=>{
    const name = document.getElementById('tr-name').value.trim();
    if(!name) return alert('Feed name required');
    const replaces = document.getElementById('tr-replaces').value;
    let replacesAmt = 0;
    if(replaces){
      const amAmt = (hd.feedingPlan.AM||[]).find(i=>i.name===replaces);
      const pmAmt = (hd.feedingPlan.PM||[]).find(i=>i.name===replaces);
      replacesAmt = (amAmt?amAmt.amt:0) + (pmAmt?pmAmt.amt:0);
    }
    const t = {
      id: uid(), itemName:name, targetAmt: parseFloat(document.getElementById('tr-target').value)||0,
      unit: document.getElementById('tr-unit').value.trim()||'lb', timing: document.getElementById('tr-timing').value,
      weeks: parseInt(document.getElementById('tr-weeks').value)||2, startDate: todayStr(), startAmt:0,
      replaces: replaces||null, replacesAmt, status:'active'
    };
    hd.transitions = hd.transitions || [];
    hd.transitions.push(t);
    applyTransitionToFeedingPlan(hd, t);
    await sSet('horse-data:'+id, hd);
    closeModal(); renderScreen();
  });
}
function applyTransitionToFeedingPlan(hd, t){
  const week = t.status==='complete' ? t.weeks : currentTransitionWeek(t);
  const frac = week/t.weeks;
  const amt = +(t.startAmt + (t.targetAmt-t.startAmt)*frac).toFixed(2);
  const timings = t.timing==='Both' ? ['AM','PM'] : [t.timing];
  const perTiming = t.timing==='Both' ? +(amt/2).toFixed(2) : amt;
  timings.forEach(tm=>{
    hd.feedingPlan[tm] = hd.feedingPlan[tm] || [];
    let existing = hd.feedingPlan[tm].find(i=>i.transitionId===t.id);
    if(existing) existing.amt = perTiming;
    else hd.feedingPlan[tm].push({ name:t.itemName, amt:perTiming, unit:t.unit, transitionId:t.id });
  });
  if(t.replaces){
    const oldAmt = +(t.replacesAmt*(1-frac)).toFixed(2);
    ['AM','PM'].forEach(tm=>{
      const item = (hd.feedingPlan[tm]||[]).find(i=>i.name===t.replaces && !i.transitionId);
      if(item) item.amt = Math.max(0, oldAmt / (t.timing==='Both'?2: (hd.feedingPlan.AM.find(i=>i.name===t.replaces)&&hd.feedingPlan.PM.find(i=>i.name===t.replaces)?2:1)));
    });
  }
  if(week>=t.weeks) t.status='complete';
}
async function runTransitionUpdates(){
  let changed = [];
  for(const h of STATE.horses){
    const hd = STATE.horseData[h.id];
    if(!hd || !hd.transitions) continue;
    let touched = false;
    hd.transitions.filter(t=>t.status==='active').forEach(t=>{ applyTransitionToFeedingPlan(hd, t); touched = true; });
    if(touched) changed.push(h.id);
  }
  for(const id of changed) await sSet('horse-data:'+id, STATE.horseData[id]);
}
async function cancelTransition(horseId, transitionId){
  const hd = STATE.horseData[horseId];
  const t = hd.transitions.find(x=>x.id===transitionId);
  if(!t) return;
  t.status = 'cancelled';
  ['AM','PM'].forEach(tm=>{ hd.feedingPlan[tm] = (hd.feedingPlan[tm]||[]).filter(i=>i.transitionId!==transitionId); });
  await sSet('horse-data:'+horseId, hd);
  renderScreen();
}

function renderFeed(){
  const today = todayStr();
  const bagRows = STATE.horses.map(h=>{
    const hd = STATE.horseData[h.id];
    const skipped = (hd.skipDates||[]).includes(today);
    const medsAM = (hd.medsPlan||[]).filter(m=>m.timing==='AM'||m.timing==='Both').map(m=>({name:m.name, amt:m.dose, unit:m.unit}));
    const medsPM = (hd.medsPlan||[]).filter(m=>m.timing==='PM'||m.timing==='Both').map(m=>({name:m.name, amt:m.dose, unit:m.unit}));
    const combinedPlan = { AM:[...(hd.feedingPlan.AM||[]), ...medsAM], PM:[...(hd.feedingPlan.PM||[]), ...medsPM] };
    const days = hd.preparedBags.daysRemaining;
    return `
      <div class="card">
        <div class="row">
          <div><div class="name">${h.name}</div><div class="sub">Bags at barn: <span style="color:${days<2?'#8C2F2F':'#3D5A42'}; font-weight:600;">${days} days left</span></div></div>
          <button class="btn-sm" data-prep="${h.id}">Prep More</button>
        </div>
        <label class="toggle" style="margin:8px 0 0;"><input type="checkbox" class="skip-toggle" data-horse="${h.id}" ${skipped?'checked':''}> Skip today (no bags used)</label>
        <div style="margin-top:8px;">${renderFeedRecipe(combinedPlan)}</div>
        <div class="btn-row"><button class="btn-sm" data-editplan="${h.id}">Edit Feeding Plan</button></div>
      </div>`;
  }).join('');

  const invRows = STATE.inventory.items.map(it=>{
    const use = dailyUsage(it.name);
    const daysLeft = use>0 ? Math.floor(it.qtyOnHand/use) : null;
    const low = daysLeft!==null && daysLeft<=it.reorderDays;
    return `<div class="card row" data-editinv="${it.id}" style="cursor:pointer;">
      <div><div class="name">${it.name}</div><div class="sub">${it.qtyOnHand} ${it.unit} on hand · ${use} ${it.unit}/day across all horses</div></div>
      <div class="pill ${low?'low':'ok'}">${daysLeft!==null? daysLeft+' DAYS' : 'N/A'}</div>
    </div>`;
  }).join('');

  return `
    <div class="section-label">— Prepared Bags at the Barn — <span class="add-link">${fmtDate(today)}</span></div>
    ${bagRows}
    <div class="banner">Prepared bags debit by 1 day automatically each day, whether or not anyone logs a feeding. When you drop a fresh batch at the barn, tap "Prep More" — that's the only thing that pulls from raw backstock below.</div>
    <div class="section-label">— Raw Backstock — <span class="add-link" id="addInv">+ Add Item</span></div>
    ${invRows || '<div class="empty">No inventory items yet.</div>'}
  `;
}
function attachFeedHandlers(){
  document.querySelectorAll('.skip-toggle').forEach(cb=>cb.addEventListener('change', async e=>{
    const hd = STATE.horseData[e.target.dataset.horse];
    hd.skipDates = hd.skipDates || [];
    const today = todayStr();
    if(e.target.checked){ if(!hd.skipDates.includes(today)) hd.skipDates.push(today); }

    const hd = STATE.horseData[h.id];
    const skipped = (hd.skipDates||[]).includes(today);
    text += `${h.name}${skipped?' (SKIP TODAY)':''} — Bags at barn: ${hd.preparedBags.daysRemaining} days left${hd.preparedBags.daysRemaining<2?' ⚠ NEEDS RESTOCK':''}\n`;
    text += `  AM: ${(hd.feedingPlan.AM||[]).map(i=>`${i.name} ${i.amt}${i.unit}`).join(', ')||'—'}\n`;
    text += `  PM: ${(hd.feedingPlan.PM||[]).map(i=>`${i.name} ${i.amt}${i.unit}`).join(', ')||'—'}\n\n`;
  });
  text += `Raw Backstock Levels:\n`;
  STATE.inventory.items.forEach(it=>{ text += `  ${it.name}: ${it.qtyOnHand} ${it.unit} on hand\n`; });
  document.getElementById('exportResult').innerHTML = `
    <div class="card"><div class="report-body">${text.replace(/\n/g,'<br>')}</div>
    <div class="btn-row"><button class="btn btn-secondary" id="copyExport">Copy</button></div></div>
  `;
  document.getElementById('copyExport').addEventListener('click', ()=>navigator.clipboard.writeText(text).then(()=>alert('Copied!')));
}

/* ============================= MODAL HELPERS ============================= */
function showModal(html){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'modalOverlay';
  overlay.innerHTML = `<div class="modal"><div class="modal-head"><button class="close" id="modalClose">✕</button></div>${html}</div>`;
  document.body.appendChild(overlay);
  document.getElementById('modalClose').addEventListener('click', closeModal);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) closeModal(); });
}
function closeModal(){ const o = document.getElementById('modalOverlay'); if(o) o.remove(); }

/* ============================= BOOT ============================= */
(async function boot(){
  const params = new URLSearchParams(location.search);
  const respondId = params.get('respond');
  document.getElementById('app').innerHTML = `<div style="padding:60px 20px; text-align:center; color:#F6F3EA; font-family:'JetBrains Mono',monospace;">Loading Stable...</div>`;
  await loadAll();
  if(respondId){ RESPOND_MODE = {requestId: respondId}; }
  render();
})();
</script>
