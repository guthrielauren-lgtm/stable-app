<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stable">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@500;700&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');
  :root{
    --barn-green:#1F2E23; --sage:#3D5A42; --chalk:#F6F3EA; --paper:#D4CBB3;
    --brass:#B5824A; --red:#8C2F2F; --ink:#3a3527;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%; background:#0f1512; font-family:'Archivo',sans-serif; color:var(--ink);}
  button{font-family:inherit; cursor:pointer;}
  input,textarea,select{font-family:inherit; font-size:14px;}
  #app{max-width:460px; margin:0 auto; background:var(--chalk); min-height:100vh; display:flex; flex-direction:column; position:relative;}
  .topbar{background:var(--barn-green); color:var(--chalk); padding:18px 18px 14px; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:5;}
  .brand{font-family:'Roboto Slab',serif; font-weight:700; font-size:20px;}
  .brand span{color:var(--brass);}
  .topbar .sub{font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--paper); opacity:.85;}
  .screen{flex:1; padding:16px 16px 100px;}
  .section-label{font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--sage); margin:22px 2px 10px; font-weight:600; display:flex; justify-content:space-between; align-items:center;}
  .section-label:first-child{margin-top:0;}
  .section-label .add-link{font-size:11px; color:var(--brass); cursor:pointer;}

  .stall-card{background:var(--barn-green); border-radius:6px; margin-bottom:14px; overflow:hidden; border:1px solid #0c1410; position:relative; cursor:pointer;}
  .stall-tag{position:absolute; top:12px; right:-1px; color:var(--barn-green); font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:700; letter-spacing:1px; padding:4px 10px 4px 12px; border-radius:4px 0 0 4px; text-transform:uppercase;}
  .stall-photo{aspect-ratio:4/3; max-height:280px; background-size:cover; background-position:center; display:flex; align-items:center; justify-content:center; color:rgba(246,243,234,.35); font-family:'JetBrains Mono',monospace; font-size:11px;}
  .stall-body{padding:14px 16px 16px;}
  .stall-name{font-family:'Roboto Slab',serif; font-weight:700; font-size:18px; color:var(--chalk); margin:0 0 2px;}
  .stall-sub{font-size:12px; color:var(--paper); opacity:.75; margin-bottom:12px;}
  .nameplate-row{display:flex; gap:10px; border-top:1px solid rgba(246,243,234,.12); padding-top:10px;}
  .nameplate-item{flex:1; min-width:0;}
  .nameplate-label{font-family:'JetBrains Mono',monospace; font-size:9px; text-transform:uppercase; letter-spacing:1px; color:var(--brass); margin-bottom:3px;}
  .nameplate-val{font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--chalk); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .nameplate-val.alert{color:#e2a15a;}

  .quick-row{display:flex; gap:8px; margin-bottom:4px;}
  .quick-btn{flex:1; background:var(--paper); border-radius:6px; padding:12px 6px; text-align:center; border:1px solid #c4b998;}
  .care-tabs{display:flex; gap:6px; margin:14px 0 10px; overflow-x:auto;}

<div id="app"></div>

<script>
/* ============================= STORAGE HELPERS ============================= */
/* ============================= STORAGE HELPERS (localStorage — standalone GitHub build) ============================= */
/* NOTE: localStorage is per-browser, per-device. Unlike the Claude-hosted version, there is
   no cross-device sync here — each device (phone, tablet, desktop) keeps its own separate copy.
   Use Settings > Download Backup / Restore to move data between devices. */
let SYNC_OK = true;
const LS_PREFIX = 'stable_';
function markSyncStatus(ok){ SYNC_OK = ok; const dot = document.getElementById('syncDot'); if(dot) dot.style.display = ok ? 'none' : 'inline-block'; }
async function sGet(key){
  try{
    const val = localStorage.getItem(LS_PREFIX+key);
    return val !== null ? JSON.parse(val) : null;
  }catch(e){ return null; }
}
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
async function sSet(key, val){
  try{
    localStorage.setItem(LS_PREFIX+key, JSON.stringify(val));
    markSyncStatus(true);
    return true;
  }catch(e){
    markSyncStatus(false);
    if(e.name === 'QuotaExceededError'){
      alert('Storage is full. Try downloading a backup, then trimming old photos or reports.');
    }
    return false;
  }
}
function unitOptions(selected){
  const units = ['lb','oz','g','kg','scoop','cup','tbsp','tsp','ml','dose','IU'];
  return units.map(u=>`<option value="${u}" ${u===selected?'selected':''}>${u}</option>`).join('');
}
function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }
function todayStr(){ return new Date().toISOString().slice(0,10); }

/* ============================= CLAUDE API (bring-your-own-key, direct browser calls) ============================= */
async function callClaude(body){
  if(!STATE.apiKey){
    const err = new Error('No API key set. Add your Anthropic API key in Settings to use AI Reports.');
    err.noApiKey = true;
    throw err;
  }
  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'x-api-key': STATE.apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify(body)
  });
  if(!resp.ok){
    const errText = await resp.text();
    throw new Error(`API error (${resp.status}): ${errText.slice(0,200)}`);
  }
  return await resp.json();
}
function fmtDate(d){ return new Date(d+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
function ageFromBirthDate(birthDate){
  if(!birthDate) return null;
  const b = new Date(birthDate+'T00:00:00'); const now = new Date();
  let years = now.getFullYear() - b.getFullYear();
  const hasHadBirthdayThisYear = (now.getMonth()>b.getMonth()) || (now.getMonth()===b.getMonth() && now.getDate()>=b.getDate());
  if(!hasHadBirthdayThisYear) years--;
  if(years < 1){
    let months = (now.getFullYear()-b.getFullYear())*12 + (now.getMonth()-b.getMonth());
    return months+'mo';
  }
  return years+'yo';
}
function gotchaDisplay(gotchaDate){
  if(!gotchaDate) return 'Not set';
  const today = todayStr();
  if(gotchaDate > today){
    const days = daysBetween(today, gotchaDate);
    return `Arriving ${fmtDate(gotchaDate)} (in ${days} day${days===1?'':'s'})`;
  }
  const days = daysBetween(gotchaDate, today);
  if(days < 30) return `${fmtDate(gotchaDate)} (${days} day${days===1?'':'s'} together)`;
  return `${fmtDate(gotchaDate)} (${ageFromBirthDate(gotchaDate)} together)`;
}
function horseSubhead(h){
  const parts = [];
  const age = ageFromBirthDate(h.birthDate);
  if(age) parts.push(age);
  if(h.heightHH) parts.push(h.heightHH+'hh');
  if(h.breed) parts.push(h.breed);
  if(h.sex) parts.push(h.sex);
  return parts.join(' \u00b7 ') || 'No profile details yet';
}
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
function nextDueInfo(hd, h, type){
  const interval = (h.careIntervals && h.careIntervals[type]) || null;
  if(!interval) return null;
  const records = (hd.vetRecords||[]).filter(r=>r.type===type).sort((a,b)=>b.date.localeCompare(a.date));
  if(records.length===0) return {status:'none', label:'No visit logged yet'};
  const last = records[0].date;
  const due = new Date(last); due.setDate(due.getDate() + interval*7);
  const dueStr = due.toISOString().slice(0,10);
  const daysOut = daysBetween(todayStr(), dueStr);
  return { status: daysOut<0 ? 'overdue' : (daysOut<=7 ? 'soon' : 'ok'), label: daysOut<0 ? `Overdue by ${Math.abs(daysOut)}d` : `Due ${fmtDate(dueStr)} (${daysOut}d)`, lastDate:last };
}

/* ============================= STATE ============================= */
let STATE = {
  horses: [],           // horses-roster
  horseData: {},         // horse-data:{id} keyed by id, lazy loaded
  inventory: {items:[], lastDebitDate: todayStr()}, // inventory
  contacts: {trainer:null, vet:null, farrier:null, bodywork:null, custom:[]}, // contacts
  requests: [],          // requests
  customSupplements: {}, // supplement-database - user-added products, keyed by lowercase name
  lastBackupDate: null,  // last-backup-date
  apiKey: null,           // anthropic-api-key (stored locally on this device only)
};
let ACTIVE_TAB = 'horses';
let ACTIVE_HORSE = null;
let CARE_CATEGORY = 'training'; // training | farrier | bodywork | medical
let RESPOND_MODE = null; // {requestId}

/* ============================= SEED DATA ============================= */
function seedHorses(){
  return [
    {
      id:'quill', name:'Quill', registeredName:'Quilliam RSF', breeder:'Rio Star Farms', birthDate:'2020-06-03', gotchaDate:'2022-07-04', heightHH:18.2, breed:'Oldenburg', sex:'Gelding', color:'', markings:'Snip, rear socks, front pastern marks', microchipNumber:'', registrationNumber:'', breeding:'Sire: Qredit; Dam: out of a Diamond-line stud mare', tagColor:'#B5824A', tagLabel:'Dressage', photo:null,
      vetContext:{allergies:'None known', conditions:'History of white line disease (monitored); presumptive gastric sensitivity, omeprazole discussed with vet', meds:'', notes:'Long-standing bond, owned since ~age 2. Under saddle with trainer Jo.'}, careIntervals:{farrier:4, vet:26, bodywork:4}
    },
    {
      id:'willow', name:'Willow', registeredName:'Willow Rose RSF', breeder:'Rio Star Farm', birthDate:'2024-06-14', gotchaDate:'2026-07-17', heightHH:16.2, breed:'GOV (Oldenburg NA) Premium', sex:'Filly', color:'', markings:'None', microchipNumber:'', registrationNumber:'', breeding:'Sire: Fynch Hatton; Dam: Windsor Rose RSF (by Rascalino, out of Winter Willow RSF by Winterprinz)', tagColor:'#7d9a80', tagLabel:'Young Stock', photo:null,
      vetContext:{allergies:'None known', conditions:'Bilateral hind fetlock OCD surgical history — monitor growth plates and DOD risk', meds:'', notes:'Relocated Texas \u2192 Colorado. Not yet in work. From Rio Star Farm.'}, careIntervals:{farrier:4, vet:26, bodywork:4}
    }
  ];
}
function seedInventory(){
  return {
    items:[
      {id:uid(), name:'Empower Boost', unit:'lb', qtyOnHand:20, reorderDays:5},
      {id:uid(), name:'Empower Topline Balance', unit:'lb', qtyOnHand:35, reorderDays:5},
      {id:uid(), name:"Farrier's Formula Extra Strength", unit:'scoop', qtyOnHand:60, reorderDays:7},
      {id:uid(), name:'Elevate Vitamin E', unit:'scoop', qtyOnHand:40, reorderDays:5},
      {id:uid(), name:'Uckele Gut', unit:'scoop', qtyOnHand:30, reorderDays:5},
      {id:uid(), name:'Beet Pulp Shreds', unit:'lb', qtyOnHand:25, reorderDays:5},
      {id:uid(), name:'Alfalfa Pellets', unit:'lb', qtyOnHand:30, reorderDays:5},
    ],
    lastDebitDate: todayStr()
  };
}
function emptyHorseData(){
  return { feedingPlan:{AM:[], PM:[]}, medsPlan:[], skipDates:[], bcsLog:[], vetRecords:[], trainingNotes:[], aiReports:[], preparedBags:{daysRemaining:0, lastPrepDate:null}, photoLog:[], transitions:[], dailyCheckins:[], forage:emptyForage() };
}
function emptyForage(){
  return {
    hayType:'', cutting:'', estLbsPerDay:null, source:'', notes:'',
    measuredItems:[] // e.g. beet pulp, alfalfa pellets — {name, amt, unit}; NOT included in Nutrition Snapshot math
  };
}

/* ============================= INIT / LOAD ============================= */
async function runMigrations(){
  let applied = await sGet('migrations');
  if(!applied) applied = [];
  const MIG_ID = 'willow-real-diet-and-profiles-2026-07-13';
  if(applied.includes(MIG_ID)) return;

  const quill = STATE.horses.find(h=>h.id==='quill');
  const willow = STATE.horses.find(h=>h.id==='willow');
  let rosterChanged = false;

  if(quill){
    quill.birthDate = '2020-06-03';
    quill.registeredName = quill.registeredName || 'Quilliam RSF';
    quill.breeder = quill.breeder || 'Rio Star Farms';
    quill.markings = quill.markings || 'Snip, rear socks, front pastern marks';
    rosterChanged = true;
  }
  if(willow){
    willow.birthDate = '2024-06-14';
    willow.registeredName = willow.registeredName || 'Willow Rose RSF';
    willow.breeder = willow.breeder || 'Rio Star Farm';
    willow.markings = willow.markings || 'None';
    rosterChanged = true;
  }
  if(rosterChanged) await sSet('horses-roster', STATE.horses);

  // Willow is actually still on Bryant Grain 14% Equine Energy Plus at ~8 lb/day (4 AM + 4 PM),
  // not yet on Empower Topline Balance. Correct her live feeding plan and set up the real transition,
  // starting Monday (the day after she arrives at the new barn).
  const willowHd = STATE.horseData['willow'];
  if(willowHd){
    willowHd.feedingPlan = {
      AM: [ {name:'14% Concentrate (transition)', amt:4, unit:'lb'}, {name:"Farrier's Formula Extra Strength", amt:1, unit:'scoop'} ],
      PM: [ {name:'14% Concentrate (transition)', amt:4, unit:'lb'} ]
    };
    const startDate = '2026-07-13'; // Monday
    willowHd.transitions = willowHd.transitions || [];
    willowHd.transitions.push({
      id: uid(), itemName:'Empower Topline Balance', targetAmt:2, unit:'lb', timing:'Both', weeks:3,
      startDate, startAmt:0, replaces:'14% Concentrate (transition)', replacesAmt:8, status:'active'
    });
    willowHd.transitions.push({
      id: uid(), itemName:'Elevate Vitamin E', targetAmt:1, unit:'scoop', timing:'AM', weeks:3,
      startDate, startAmt:0, replaces:null, replacesAmt:0, status:'active'
    });
    willowHd.transitions.forEach(t=>{ if(t.startDate===startDate) applyTransitionToFeedingPlan(willowHd, t); });
    await sSet('horse-data:willow', willowHd);
    STATE.horseData['willow'] = willowHd;
  }

  // Make sure Bryant Grain is tracked in backstock so the transition's ramp-down debits correctly
  if(!STATE.inventory.items.find(i=>i.name==='Bryant Grain 14% Equine Energy Plus')){
    STATE.inventory.items.push({id:uid(), name:'Bryant Grain 14% Equine Energy Plus', unit:'lb', qtyOnHand:40, reorderDays:5});
    await sSet('inventory', STATE.inventory);
  }

  applied.push(MIG_ID);
  await sSet('migrations', applied);

  // Second pass: generalize any already-saved 'Bryant Grain' references to a brand-neutral
  // '14% Concentrate (transition)' label, so switching supply sources mid-transition doesn't
  // break the name-matching that drives auto-debit.
  const MIG_ID_2 = 'willow-generic-concentrate-rename-2026-07';
  if(!applied.includes(MIG_ID_2)){
    const OLD_NAME = 'Bryant Grain 14% Equine Energy Plus';
    const NEW_NAME = '14% Concentrate (transition)';
    const wHd = STATE.horseData['willow'];
    if(wHd){
      let changed = false;
      ['AM','PM'].forEach(tm=>{
        (wHd.feedingPlan[tm]||[]).forEach(it=>{ if(it.name===OLD_NAME){ it.name = NEW_NAME; changed=true; } });
      });
      (wHd.transitions||[]).forEach(t=>{ if(t.replaces===OLD_NAME){ t.replaces = NEW_NAME; changed=true; } });
      if(changed) await sSet('horse-data:willow', wHd);
    }
    const oldInvItem = STATE.inventory.items.find(i=>i.name===OLD_NAME);
    if(oldInvItem){ oldInvItem.name = NEW_NAME; await sSet('inventory', STATE.inventory); }
    applied.push(MIG_ID_2);
    await sSet('migrations', applied);
  }

  // Third pass: log the bridge-feed decision (Nutrena SafeChoice All Life Stages chosen over
  // Purina Impact 14:6 for its closer trace-mineral match to Bryant Grain) for future reference.
  const MIG_ID_3 = 'willow-bridge-feed-note-2026-07';
  if(!applied.includes(MIG_ID_3)){
    const w = STATE.horses.find(h=>h.id==='willow');
    if(w){
      const note = 'Bridge feed for "14% Concentrate" backstock: Nutrena SafeChoice All Life Stages (Chewy) chosen over Purina Impact 14:6 — closer match to prior Bryant Grain feed on trace mineral form (both use chelated Zinc/Copper/Cobalt complexes) and includes yeast culture.';
      w.vetContext.notes = w.vetContext.notes ? w.vetContext.notes + ' | ' + note : note;
      await sSet('horses-roster', STATE.horses);
    }
    applied.push(MIG_ID_3);
    await sSet('migrations', applied);
  }

  // Fourth pass: gotcha dates, Quill's feeding correction (2lb -> 1.5lb/serving), and Willow's full vet history.
  const MIG_ID_4 = 'gotcha-dates-and-willow-vet-history-2026-07';
  if(!applied.includes(MIG_ID_4)){
    const quill = STATE.horses.find(h=>h.id==='quill');
    const willow = STATE.horses.find(h=>h.id==='willow');
    let rosterChanged = false;

    if(quill){
      quill.gotchaDate = '2022-07-04';
      rosterChanged = true;
    }
    if(willow){
      willow.gotchaDate = '2026-07-17';
      willow.vetContext.conditions = 'Bilateral hind fetlock OCD — found incidentally on X-rays during a prior potential buyer\'s PPE; no lameness or clinical symptoms ever (before, during, or after). Surgically corrected at Weems & Stephens Equine Hospital, Aubrey, TX; surgeon "very pleased with results." Post-op LM radiographs (study date 1/31/2026) read as clean healing — appropriate joint space, clean margins, no visible loose bodies. ~5 months sound movement post-surgery as of last review. Additional back/neck radiographs also on file (see Vet Records) — monitor growth plates and DOD risk given ongoing growth.';
      rosterChanged = true;
    }
    if(rosterChanged) await sSet('horses-roster', STATE.horses);

    const quillHd = STATE.horseData['quill'];
    if(quillHd){
      ['AM','PM'].forEach(tm=>{
        const item = (quillHd.feedingPlan[tm]||[]).find(i=>i.name==='Empower Topline Balance' && !i.transitionId);
        if(item) item.amt = 1.5;
      });
      await sSet('horse-data:quill', quillHd);
    }

    const willowHd = STATE.horseData['willow'];
    if(willowHd){
      willowHd.vetRecords = willowHd.vetRecords || [];
      willowHd.vetRecords.push({
        id: uid(), type:'vet', date:'2026-01-31',
        notes: "Post-op radiographs (LM views) following bilateral hind fetlock OCD surgical removal at Weems & Stephens Equine Hospital, Aubrey, TX. Lesions found incidentally on a prior potential buyer's PPE X-rays — no lameness or clinical symptoms at any point. Surgeon very pleased with results; films read as clean healing (appropriate joint space, clean margins, no visible loose bodies). Additional radiograph sets on file: back and neck single views (Weems & Stephens); follow-up neck obliques by Dr. Sefuentes after an initial neck view showed a shadowy/unclear section — follow-up obliques came back clean. Actual radiograph image files not yet attached to this app; ask Lauren to upload if needed."
      });
      await sSet('horse-data:willow', willowHd);
    }

    applied.push(MIG_ID_4);
    await sSet('migrations', applied);
  }

  // Fifth pass: Quill's corrected profile and full veterinary/dental history from
  // real documents (PPE, Coggins, Purchase Agreement, Animal Clinic patient history report).

async function saveAutoSnapshot(){
  // Rolling in-storage safety net, distinct from manual off-device backups.
  // Protects against a bad migration or logic bug corrupting live data mid-session,
  // but is NOT a substitute for downloading a real backup - it lives in the same storage backend.
  try{
    const snapshot = collectFullBackup();
    await sSet('auto-snapshot', snapshot);
  }catch(e){ /* non-critical, don't block app load if this fails */ }
}
function collectFullBackup(){
  return {
    backupVersion: 1,
    takenAt: todayStr(),
    horses: STATE.horses,
    horseData: STATE.horseData,
    inventory: STATE.inventory,
    contacts: STATE.contacts,
    requests: STATE.requests,
    customSupplements: STATE.customSupplements,
  };
}
async function downloadBackup(){
  const backup = collectFullBackup();
  const blob = new Blob([JSON.stringify(backup, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `stable-backup-${todayStr()}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  STATE.lastBackupDate = todayStr();
  await sSet('last-backup-date', STATE.lastBackupDate);
}
async function restoreFromBackupFile(file){
  const text = await file.text();
  let backup;
  try{ backup = JSON.parse(text); }
  catch(e){ throw new Error('That file is not valid JSON.'); }
  if(!backup.horses || !backup.horseData){ throw new Error('That file doesn\'t look like a Stable backup.'); }
  STATE.horses = backup.horses;
  STATE.horseData = backup.horseData;
  STATE.inventory = backup.inventory || STATE.inventory;
  STATE.contacts = backup.contacts || STATE.contacts;
  STATE.requests = backup.requests || STATE.requests;
  STATE.customSupplements = backup.customSupplements || STATE.customSupplements;
  await sSet('horses-roster', STATE.horses);
  await sSet('inventory', STATE.inventory);
  await sSet('contacts', STATE.contacts);
  await sSet('requests', STATE.requests);
  await sSet('supplement-database', STATE.customSupplements);
  for(const h of STATE.horses) await sSet('horse-data:'+h.id, STATE.horseData[h.id]);
}

/* ============================= AUTO-DEBIT ============================= */
async function runAutoDebit(){
  // Prepared bags (barn-side, ready to feed) debit by 1 day per elapsed day.
  // Raw backstock is untouched here - it only moves when Lauren explicitly preps a new batch.
  const today = todayStr();
  let horseChanged = [];
  for(const h of STATE.horses){
    const hd = STATE.horseData[h.id];
    if(!hd) continue;
    hd.preparedBags = hd.preparedBags || {daysRemaining:0, lastPrepDate:null};
    const last = hd.preparedBags.lastDebitDate || today;
    const gap = daysBetween(last, today);
    if(gap <= 0) continue;
    let debitDays = 0;
    for(let i=1;i<=gap;i++){
      const d = new Date(last); d.setDate(d.getDate()+i);
      const dStr = d.toISOString().slice(0,10);
      if(!(hd.skipDates||[]).includes(dStr)) debitDays++;
    }
    hd.preparedBags.daysRemaining = Math.max(0, +(hd.preparedBags.daysRemaining - debitDays).toFixed(2));
    hd.preparedBags.lastDebitDate = today;
    horseChanged.push(h.id);
  }
  for(const id of horseChanged) await sSet('horse-data:'+id, STATE.horseData[id]);
}

/* Prep a batch of days' worth of bags for a horse: consumes raw backstock, adds to that horse's prepared-bag count */
async function prepBags(horseId, days){
  const hd = STATE.horseData[horseId];
  const items = [...(hd.feedingPlan.AM||[]), ...(hd.feedingPlan.PM||[])];
  const needed = {};
  items.forEach(it=>{ needed[it.name] = (needed[it.name]||0) + it.amt*days; });
  const shortfalls = [];
  Object.keys(needed).forEach(name=>{
    const invItem = STATE.inventory.items.find(x=>x.name.toLowerCase()===name.toLowerCase());
    if(!invItem || invItem.qtyOnHand < needed[name]) shortfalls.push(name);
  });
  if(shortfalls.length){
    return {ok:false, shortfalls};
  }
  Object.keys(needed).forEach(name=>{
    const invItem = STATE.inventory.items.find(x=>x.name.toLowerCase()===name.toLowerCase());
    invItem.qtyOnHand = +(invItem.qtyOnHand - needed[name]).toFixed(2);
  });
  hd.preparedBags.daysRemaining = +(hd.preparedBags.daysRemaining + days).toFixed(2);
  hd.preparedBags.lastPrepDate = todayStr();
  await sSet('inventory', STATE.inventory);
  await sSet('horse-data:'+horseId, hd);
  return {ok:true};
}

function dailyUsage(itemName){
  let total = 0;
  for(const h of STATE.horses){
    const hd = STATE.horseData[h.id]; if(!hd) continue;
    const items = [...(hd.feedingPlan.AM||[]), ...(hd.feedingPlan.PM||[])];
    for(const it of items) if(it.name.toLowerCase()===itemName.toLowerCase()) total += it.amt;
  }
  return total;
}

/* ============================= PHOTO COMPRESSION ============================= */
function compressImage(file, maxDim=800, quality=0.72){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        let w=img.width, h=img.height;
        if(w>h && w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; }
        else if(h>=w && h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ============================= AI REPORT ============================= */
function seasonFromDate(dateStr){
  const month = parseInt(dateStr.slice(5,7), 10);
  // Northern hemisphere (Colorado) seasons
  if(month===12 || month===1 || month===2) return 'Winter';
  if(month>=3 && month<=5) return 'Spring';
  if(month>=6 && month<=8) return 'Summer';
  return 'Fall';
}
async function generateAIReport(horseId, photoDataUrl, qualNotes){
  const h = STATE.horses.find(x=>x.id===horseId);
  const hd = STATE.horseData[horseId];
  const recentNotes = (hd.trainingNotes||[]).slice(-5).map(n=>`- [${n.date}] ${n.author}: ${n.content}`).join('\n') || 'None';
  const recentBcs = (hd.bcsLog||[]).slice(-3).map(b=>`- [${b.date}] BCS ${b.score}/9, ${b.weight}lb, ${b.notes||''}`).join('\n') || 'None';
  const today = todayStr();
  const season = seasonFromDate(today);

  const sys = `You are an experienced equine bodywork and conditioning assessor helping a horse owner track a horse's progress over time. You will be shown a photo and given context, including today's date and season. Respond ONLY with valid JSON, no markdown fences, no preamble, in this exact shape:
{"assessment":"2-4 sentence plain-language visual + qualitative assessment, noting posture, topline, muscling, weight, and anything relevant to soundness or condition. Be specific but appropriately cautious - you are not a substitute for a vet exam.",
"trainerQuestions":["q1","q2"],
"vetQuestions":["q1"],
"farrierQuestions":["q1"],
"bodyworkQuestions":["q1"]}
Factor the season into your assessment and questions where genuinely relevant — for example: coat/hair coat changes and shedding cycles, seasonal weight or topline fluctuation (spring grass, summer workload, fall/winter calorie needs), hydration and heat stress risk in hot months, blanketing/footing/turnout considerations in cold months, and spring pasture-related laminitis/founder risk for at-risk horses. Only raise a seasonal point if it's actually warranted by what you see or read — do not force a seasonal comment into every report.
Keep each question array to 1-3 sharp, specific questions only if genuinely warranted by what you see/read - do not pad with generic filler.`;

  const userText = `Horse: ${h.name} (${horseSubhead(h)})
Today's date: ${today} (${season}, Colorado/Denver area)
Vet context: allergies: ${h.vetContext.allergies||'none'}; conditions: ${h.vetContext.conditions||'none'}
Owner's qualitative notes for this check-in: ${qualNotes||'(none provided)'}
Recent training notes:
${recentNotes}
Recent BCS/weight log:
${recentBcs}`;

  const content = [{type:'text', text:userText}];
  if(photoDataUrl){
    const match = photoDataUrl.match(/^data:(image\/\w+);base64,(.*)$/);
    if(match) content.unshift({type:'image', source:{type:'base64', media_type:match[1], data:match[2]}});
  }

  const data = await callClaude({
    model:'claude-sonnet-4-6', max_tokens:1000, system: sys,
    messages:[{role:'user', content}]
  });
  const textBlocks = (data.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('\n');
  let parsed;
  try{ parsed = JSON.parse(textBlocks.replace(/```json|```/g,'').trim()); }
  catch(e){ parsed = {assessment: textBlocks || 'Could not parse AI response.', trainerQuestions:[], vetQuestions:[], farrierQuestions:[], bodyworkQuestions:[]}; }
  return parsed;
}

  'empower boost': { unit:'lb', vitE:500, se:0.272, zn:34.0, cu:11.34, mg:null, ca:9072, p:4082.4, biotin:1.5, cp:54.432, fat:99.792, confidence:'label', source:"Nutrena Empower Boost guaranteed analysis. Corrects earlier error — copper IS guaranteed at 25ppm (11.34mg/lb), not absent from label. Ca shown at label's high end (2.0%). Magnesium not guaranteed on this label." },
  'elevate vitamin e': { unit:'scoop', vitE:1000, se:0, zn:0, cu:0, mg:0, ca:0, p:0, biotin:0, cp:0, fat:0, confidence:'label', source:"KPP Elevate Maintenance Powder — single-ingredient product (d-alpha-tocopheryl acetate only). 1 scoop (7g) = 1000 IU vitamin E. Confirmed genuinely zero for everything else, not a data gap." },
  "farrier's formula extra strength": { unit:'scoop', vitE:0, se:0, zn:250, cu:92, mg:null, ca:680, p:723, biotin:20, cp:21.25, fat:10.2, confidence:'estimated', source:"Farrier's Formula Double Strength official guaranteed analysis per 85g (1/2 cup) dose — CONFIRM your scoop actually measures 85g; real product line is 'Original' or 'Double Strength', not 'Extra Strength'. Ca shown at label's high end (0.80%). Magnesium not guaranteed on this label. Ca/P/Biotin in mg per scoop; CP/Fat in grams per scoop, consistent with other entries." },
  'uckele gut': { unit:'scoop', vitE:0, se:0, zn:0, cu:0, mg:0, ca:0, p:0, biotin:0, cp:0, fat:0, confidence:'label', source:"Uckele G.U.T. Powder — confirmed via actual product label (hydrolyzed collagen, licorice extract, MOS, glutamine, probiotics). No standard guaranteed analysis for CP/fat/vitamins/minerals; genuinely zero for tracked nutrients, not a data gap." },
  'nutrena safechoice all life stages': { unit:'lb', vitE:120, se:0.272, zn:72.57, cu:22.68, mg:null, ca:5443.2, p:3175.2, biotin:0.45, cp:63.504, fat:36.288, confidence:'label', source:"Chewy product listing, full guaranteed analysis verified (SKU 938062). Ca shown at label's high end (1.2%). Magnesium not guaranteed on this label." },
};
/* Note on units: vitE (IU), se/zn/cu/mg (mg), ca/p/biotin (mg), cp/fat (grams) — all "per unit" where
   unit is defined per-product (lb or scoop). A null value means the nutrient is genuinely not guaranteed
   on that product's label (data gap, not zero); a 0 value means confirmed absent from a single-ingredient
   or specialty-blend product. Ca values use the label's high end where a range is given, consistent with
   a "when uncertain, err generous" approach to flagging potential overages rather than missing them. */
/* Safe upper limits, scaled from NRC reference points for a ~1100lb mature horse.
   Vitamin E: NRC reports no established toxicity, but 10,000 IU/day is the commonly used safe-upper-limit reference.
   Selenium: NRC max tolerable = 2mg/kg dietary DM ≈ 20mg/day for an 1100lb horse at ~2% BW dry matter intake — a genuinely narrow margin, most safety-critical nutrient here. */
function safeLimits(heightHH, bodyweightLb){
  const refWeight = bodyweightLb || 1100;
  const scale = refWeight/1100;
  return {
    vitE: { limit: 10000*scale, unit:'IU/day', note:'NRC-based safe upper limit reference (vitamin E toxicity is rare in horses)' },
    se: { limit: 20*scale, unit:'mg/day', note:'NRC max tolerable ≈2mg/kg dietary DM — selenium has a genuinely narrow safety margin, treat any >70% flag seriously' },
  };
}
function lookupNutrient(itemName){
  const key = itemName.trim().toLowerCase();
  if(BUILTIN_NUTRIENT_DB[key]) return BUILTIN_NUTRIENT_DB[key];
  const custom = STATE.customSupplements || {};
  if(custom[key]) return custom[key];
  return null;
}
function computeNutritionSnapshot(hd, horse){
  const items = [...(hd.feedingPlan.AM||[]), ...(hd.feedingPlan.PM||[])];
  const NUTRIENTS = ['vitE','se','zn','cu','mg','ca','p','biotin','cp','fat'];
  const totals = {}; NUTRIENTS.forEach(n=>totals[n]=0);
  const notOnLabel = {}; NUTRIENTS.forEach(n=>notOnLabel[n]=[]); // items where this nutrient is null (not guaranteed on label)
  const untracked = [];
  const contributions = { vitE:[], se:[] };
  const perItem = [];
  items.forEach(it=>{
    const nut = lookupNutrient(it.name);
    if(!nut){ untracked.push(it.name); return; }
    const itemNutrients = {};
    NUTRIENTS.forEach(n=>{
      const val = nut[n];
      if(typeof val === 'number'){
        const contrib = val*it.amt;
        totals[n] += contrib;
        itemNutrients[n] = contrib;
        if((n==='vitE'||n==='se') && contrib>0) contributions[n].push({name:it.name, amt:contrib, confidence:nut.confidence});
      } else {
        itemNutrients[n] = null;
        notOnLabel[n].push(it.name);
      }
    });
    perItem.push({ name:it.name, amt:it.amt, unit:it.unit, nutrients:itemNutrients, confidence:nut.confidence, source:nut.source });
  });
  const limits = safeLimits(horse.heightHH, (hd.bcsLog||[]).slice(-1)[0]?.weight);
  // Ca:P ratio — only meaningful if both are actually tracked (not all-null)
  let caPRatio = null, caPStatus = 'unknown';
  if(totals.ca>0 && totals.p>0){
    caPRatio = totals.ca/totals.p;
    if(caPRatio < 1.2) caPStatus = 'low'; // too little Ca relative to P
    else if(caPRatio > 2.2) caPStatus = 'high'; // too much Ca relative to P
    else caPStatus = 'ok';
  }
  return { totals, untracked, contributions, limits, perItem, notOnLabel, caPRatio, caPStatus };
}
function checkNewSupplementSafety(hd, horse, itemName, amt){
  const nut = lookupNutrient(itemName);
  if(!nut) return null;
  const current = computeNutritionSnapshot(hd, horse);
  const warnings = [];
  ['vitE','se'].forEach(n=>{
    const addContrib = (nut[n]||0)*amt;
    if(addContrib<=0) return;
    const newTotal = current.totals[n] + addContrib;
    const limit = current.limits[n].limit;
    if(newTotal > limit*0.7){
      warnings.push({ nutrient:n==='vitE'?'Vitamin E':'Selenium', newTotal:newTotal.toFixed(2), limit:limit.toFixed(2), unit:current.limits[n].unit, overLimit: newTotal>limit });
    }
  });
  return warnings.length ? warnings : null;
}

function renderBcsChart(log){
  if(!log || log.length===0) return '<div class="empty">No entries yet.</div>';
  const w=400,h=110,pad=24;
  const weights = log.map(l=>l.weight);
  const min=Math.min(...weights)-20, max=Math.max(...weights)+20;
  const pts = log.map((l,i)=>{
    const x = pad + (i/(Math.max(log.length-1,1)))*(w-pad*2);
    const y = h - pad - ((l.weight-min)/(max-min))*(h-pad*1.5);
    return `${x},${y}`;
  }).join(' ');
  return `<div class="chart-wrap">
    <svg viewBox="0 0 ${w} ${h}" style="width:100%; height:110px;">
      <polyline points="${pts}" fill="none" stroke="#B5824A" stroke-width="2"/>
      ${log.map((l,i)=>{ const x = pad + (i/(Math.max(log.length-1,1)))*(w-pad*2); const y = h - pad - ((l.weight-min)/(max-min))*(h-pad*1.5); return `<circle cx="${x}" cy="${y}" r="3" fill="#1F2E23"/>`; }).join('')}
    </svg>
    <div class="sub">Latest: ${log[log.length-1].weight} lb · BCS ${log[log.length-1].score}/9 (${fmtDate(log[log.length-1].date)})</div>
  </div>`;
}

let EXPANDED_YEARS = {}; // horseId+year -> bool, persists only for this session
function renderVetRecordsByYear(vetRecords){
  if(!vetRecords || vetRecords.length===0) return '<div class="empty">No records yet.</div>';
  const byYear = {};
  vetRecords.forEach(v=>{
    const year = v.date.slice(0,4);
    byYear[year] = byYear[year] || [];
    byYear[year].push(v);
  });
  const years = Object.keys(byYear).sort((a,b)=>b.localeCompare(a));
  return years.map((year, idx)=>{
    const key = ACTIVE_HORSE+'-'+year;
    const isOpen = EXPANDED_YEARS[key] !== undefined ? EXPANDED_YEARS[key] : idx===0; // most recent year open by default
    EXPANDED_YEARS[key] = isOpen; // lock in the default so the toggle handler always has an accurate current state
    const records = byYear[year].slice().sort((a,b)=>b.date.localeCompare(a.date));
    return `
      <div class="year-group">
        <button class="year-header" data-year-toggle="${key}">
          <span>${year} <span class="year-count">(${records.length})</span></span>
          <span class="year-chevron">${isOpen?'▾':'▸'}</span>
        </button>
        ${isOpen ? `<div class="year-body">${records.map(v=>`
          <div class="timeline-item"><div class="timeline-date">${fmtDate(v.date)}</div><div class="timeline-author">${v.type.toUpperCase()}</div><div class="timeline-content">${v.notes}</div></div>

function renderNutritionSnapshot(hd, h){
  const snap = computeNutritionSnapshot(hd, h);
  function bar(label, key, unit){
    const val = snap.totals[key];
    const limit = snap.limits[key].limit;
    const pct = Math.min(150, (val/limit)*100);
    const status = pct>=100 ? 'over' : (pct>=70 ? 'near' : 'ok');
    const color = status==='over' ? 'var(--red)' : (status==='near' ? '#e2a15a' : 'var(--sage)');
    const hasLowConfidence = snap.contributions[key].some(c=>c.confidence!=='label');
    return `
      <div style="margin-bottom:12px;">
        <div class="row" style="margin-bottom:4px;">
          <div class="name" style="font-size:12.5px;">${label}${status==='over'?' ⚠️':(status==='near'?' ⚠':'')}</div>
          <div class="sub" style="font-family:'JetBrains Mono',monospace;">${val.toFixed(1)} / ${limit.toFixed(0)} ${unit}</div>
        </div>
        <div style="background:var(--paper); border-radius:4px; height:8px; overflow:hidden;">
          <div style="width:${pct}%; height:100%; background:${color};"></div>
        </div>
        ${hasLowConfidence?'<div class="sub" style="margin-top:2px; font-size:9.5px;">Includes estimated (unconfirmed) values — verify with label</div>':''}
      </div>`;
  }
  const NUTRIENT_LABELS = { vitE:'Vit E', se:'Se', zn:'Zn', cu:'Cu', mg:'Mg', ca:'Ca', p:'P', biotin:'Biotin', cp:'Protein', fat:'Fat' };
  const NUTRIENT_FMT = { vitE:v=>v.toFixed(0)+'IU', se:v=>v.toFixed(2)+'mg', zn:v=>v.toFixed(0)+'mg', cu:v=>v.toFixed(0)+'mg', mg:v=>v.toFixed(0)+'mg', ca:v=>(v/1000).toFixed(1)+'g', p:v=>(v/1000).toFixed(1)+'g', biotin:v=>v.toFixed(2)+'mg', cp:v=>v.toFixed(0)+'g', fat:v=>v.toFixed(0)+'g' };
  const itemRows = snap.perItem.map(it=>{
    const parts = ['vitE','se','zn','cu','mg','ca','p','biotin','cp','fat']
      .filter(n=>typeof it.nutrients[n]==='number' && it.nutrients[n]>0)
      .map(n=>`${NUTRIENT_LABELS[n]} ${NUTRIENT_FMT[n](it.nutrients[n])}`);

      <div class="sub" style="margin-top:8px; font-style:italic;">Screening tool for you and your vet to review together — not a substitute for professional dosage review.</div>
    </div>`;

async function extractLabelData(photoDataUrl){
  const sys = `You are reading a horse supplement's Guaranteed Analysis label from a photo. Extract whatever nutrient values you can find. Respond ONLY with valid JSON, no markdown fences, no preamble, in this exact shape:
{"product_name": "best guess at product name, or null", "vitE_per_lb":number_or_null, "vitE_per_serving":number_or_null, "se_ppm":number_or_null, "se_per_serving_mg":number_or_null, "zn_ppm":number_or_null, "zn_per_serving_mg":number_or_null, "cu_ppm":number_or_null, "cu_per_serving_mg":number_or_null, "serving_size_desc":"text describing the serving size as printed, or null", "raw_text":"transcribe every guaranteed-analysis line you can read, one per line"}
Use null for anything not visible or not printed on the label. Do not guess or estimate — only report what is actually printed.`;
  const match = photoDataUrl.match(/^data:(image\/\w+);base64,(.*)$/);
  const content = [{type:'text', text:'Read this supplement label and extract the guaranteed analysis.'}];
  if(match) content.unshift({type:'image', source:{type:'base64', media_type:match[1], data:match[2]}});
  const data = await callClaude({ model:'claude-sonnet-4-6', max_tokens:800, system: sys, messages:[{role:'user', content}] });
  const textBlocks = (data.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('\n');
  try{ return JSON.parse(textBlocks.replace(/```json|```/g,'').trim()); }
  catch(e){ return { raw_text: textBlocks || 'Could not read label.' }; }
}

function computeTransitionSchedule(t){
  const weeks = [];
  for(let w=1; w<=t.weeks; w++){
    const frac = w/t.weeks;
    weeks.push({ week:w, newAmt: +(t.startAmt + (t.targetAmt-t.startAmt)*frac).toFixed(2), oldAmt: t.replaces ? +(t.replacesAmt*(1-frac)).toFixed(2) : null });
  }
  return weeks;
}
function currentTransitionWeek(t){
  const daysIn = daysBetween(t.startDate, todayStr());
  if(daysIn < 0) return 0;
  return Math.max(1, Math.min(t.weeks, Math.floor(daysIn/7)+1));
}
function renderTransitions(hd){
  const active = (hd.transitions||[]).filter(t=>t.status!=='cancelled');
  if(active.length===0) return '<div class="empty">No feed transitions in progress.</div>';
  return active.map(t=>{
    const schedule = computeTransitionSchedule(t);
    const curWeek = t.status==='complete' ? t.weeks : currentTransitionWeek(t);
    const statusLabel = t.status==='complete' ? 'Complete' : (curWeek===0 ? 'Starts '+fmtDate(t.startDate) : 'Week '+curWeek+' of '+t.weeks);
    return `
      <div class="card">
        <div class="row"><div class="name">${t.itemName}${t.replaces?' (replacing '+t.replaces+')':''}</div><div class="pill ${t.status==='complete'?'ok':'neutral'}">${statusLabel}</div></div>
        <div class="sub" style="margin-top:6px;">Target: ${t.targetAmt}${t.unit} · ${t.timing} · starts ${fmtDate(t.startDate)}</div>
        <div style="margin-top:8px; display:flex; flex-wrap:wrap; gap:6px;">
          ${schedule.map(s=>`<div class="tag" style="cursor:default; ${s.week===curWeek?'background:var(--brass); color:#fff; border-color:var(--brass);':''}">Wk${s.week}: ${s.newAmt}${t.unit}${t.replaces?' / old '+s.oldAmt:''}</div>`).join('')}
        </div>
        ${t.status!=='complete' ? `<div class="btn-row"><button class="btn-sm" data-cancel-transition="${t.id}">Cancel Transition</button></div>` : ''}
      </div>`;
  }).join('');
}

  showModal(`

    <label>Replacing an existing item? (optional)</label>

    <div class="btn-row"><button class="btn btn-primary" id="tr-save">Start Transition</button></div>
  `);
  document.getElementById('tr-save').addEventListener('click', async ()=>{
    const name = document.getElementById('tr-name').value.trim();
    if(!name) return alert('Feed name required');
    const replaces = document.getElementById('tr-replaces').value;
    let replacesAmt = 0;
    if(replaces){
      const amAmt = (hd.feedingPlan.AM||[]).find(i=>i.name===replaces);
      const pmAmt = (hd.feedingPlan.PM||[]).find(i=>i.name===replaces);
      replacesAmt = (amAmt?amAmt.amt:0) + (pmAmt?pmAmt.amt:0);
    }
    const t = {
      id: uid(), itemName:name, targetAmt: parseFloat(document.getElementById('tr-target').value)||0,
      unit: document.getElementById('tr-unit').value.trim()||'lb', timing: document.getElementById('tr-timing').value,
      weeks: parseInt(document.getElementById('tr-weeks').value)||2, startDate: todayStr(), startAmt:0,
      replaces: replaces||null, replacesAmt, status:'active'
    };
    hd.transitions = hd.transitions || [];
    hd.transitions.push(t);
    applyTransitionToFeedingPlan(hd, t);
    await sSet('horse-data:'+id, hd);
    closeModal(); renderScreen();
  });
}
function applyTransitionToFeedingPlan(hd, t){
  const week = t.status==='complete' ? t.weeks : currentTransitionWeek(t);
  const frac = week/t.weeks;
  const amt = +(t.startAmt + (t.targetAmt-t.startAmt)*frac).toFixed(2);
  const timings = t.timing==='Both' ? ['AM','PM'] : [t.timing];
  const perTiming = t.timing==='Both' ? +(amt/2).toFixed(2) : amt;
  timings.forEach(tm=>{
    hd.feedingPlan[tm] = hd.feedingPlan[tm] || [];
    let existing = hd.feedingPlan[tm].find(i=>i.transitionId===t.id);
    if(existing) existing.amt = perTiming;
    else hd.feedingPlan[tm].push({ name:t.itemName, amt:perTiming, unit:t.unit, transitionId:t.id });
  });
  if(t.replaces){
    const oldAmt = +(t.replacesAmt*(1-frac)).toFixed(2);
    ['AM','PM'].forEach(tm=>{
      const item = (hd.feedingPlan[tm]||[]).find(i=>i.name===t.replaces && !i.transitionId);
      if(item) item.amt = Math.max(0, oldAmt / (t.timing==='Both'?2: (hd.feedingPlan.AM.find(i=>i.name===t.replaces)&&hd.feedingPlan.PM.find(i=>i.name===t.replaces)?2:1)));
    });
  }
  if(week>=t.weeks) t.status='complete';
}
async function runTransitionUpdates(){
  let changed = [];
  for(const h of STATE.horses){
    const hd = STATE.horseData[h.id];
    if(!hd || !hd.transitions) continue;
    let touched = false;
    hd.transitions.filter(t=>t.status==='active').forEach(t=>{ applyTransitionToFeedingPlan(hd, t); touched = true; });
    if(touched) changed.push(h.id);
  }
  for(const id of changed) await sSet('horse-data:'+id, STATE.horseData[id]);
}
async function cancelTransition(horseId, transitionId){
  const hd = STATE.horseData[horseId];
  const t = hd.transitions.find(x=>x.id===transitionId);
  if(!t) return;
  t.status = 'cancelled';
  ['AM','PM'].forEach(tm=>{ hd.feedingPlan[tm] = (hd.feedingPlan[tm]||[]).filter(i=>i.transitionId!==transitionId); });
  await sSet('horse-data:'+horseId, hd);
  renderScreen();
}

function renderFeedRecipe(feedingPlan){
  function block(list, label){
    if(!list || list.length===0) return `<div class="name">${label}</div><div class="sub">—</div>`;
    return `<div class="name">${label}</div>` + list.map(i=>
      `<div class="sub" style="margin:2px 0;">\u2022 ${i.name}: <strong>${i.amt}${i.unit}</strong>${i.transitionId?' <span style="color:var(--brass);">(ramping)</span>':''}</div>`
    ).join('');
  }
  return block(feedingPlan.AM, 'AM') + `<div style="margin-top:10px;"></div>` + block(feedingPlan.PM, 'PM');
}
function renderForage(forage){
  forage = forage || emptyForage();
  const hasHay = forage.hayType || forage.cutting || forage.estLbsPerDay || forage.source;
  return `
    <div class="card">
      <div class="sub" style="margin-bottom:8px; font-weight:600;">Separate from the Feeding Plan — not tracked for inventory, and not included in the Nutrition Snapshot math (see that section for why).</div>
      <div class="name" style="font-size:12.5px;">Hay / Pasture</div>
      ${hasHay ? `
        <div class="sub" style="margin-top:4px;">${forage.hayType||'Type not set'}${forage.cutting?' · '+forage.cutting+' cutting':''}</div>
        <div class="sub">${forage.estLbsPerDay?forage.estLbsPerDay+' lb/day (estimated)':'Amount not set'}</div>
        ${forage.source?`<div class="sub">Source: ${forage.source}</div>`:''}
        ${forage.notes?`<div class="sub" style="margin-top:4px;">${forage.notes}</div>`:''}
      ` : '<div class="sub" style="margin-top:4px;">Not set yet.</div>'}
      ${forage.measuredItems && forage.measuredItems.length ? `
        <div class="name" style="font-size:12.5px; margin-top:12px;">Measured Forage</div>
        ${forage.measuredItems.map(m=>`<div class="sub" style="margin:2px 0;">\u2022 ${m.name}: <strong>${m.amt}${m.unit}/day</strong></div>`).join('')}
      ` : ''}
    </div>`;
}

function renderFeed(){
  const today = todayStr();
  const bagRows = STATE.horses.map(h=>{
    const hd = STATE.horseData[h.id];
    const skipped = (hd.skipDates||[]).includes(today);
    const medsAM = (hd.medsPlan||[]).filter(m=>m.timing==='AM'||m.timing==='Both').map(m=>({name:m.name, amt:m.dose, unit:m.unit}));
    const medsPM = (hd.medsPlan||[]).filter(m=>m.timing==='PM'||m.timing==='Both').map(m=>({name:m.name, amt:m.dose, unit:m.unit}));
    const combinedPlan = { AM:[...(hd.feedingPlan.AM||[]), ...medsAM], PM:[...(hd.feedingPlan.PM||[]), ...medsPM] };
    const days = hd.preparedBags.daysRemaining;
    return `
      <div class="card">
        <div class="row">
          <div><div class="name">${h.name}</div><div class="sub">Bags at barn: <span style="color:${days<2?'#8C2F2F':'#3D5A42'}; font-weight:600;">${days} days left</span></div></div>
          <button class="btn-sm" data-prep="${h.id}">Prep More</button>
        </div>
        <label class="toggle" style="margin:8px 0 0;"><input type="checkbox" class="skip-toggle" data-horse="${h.id}" ${skipped?'checked':''}> Skip today (no bags used)</label>
        <div style="margin-top:8px;">${renderFeedRecipe(combinedPlan)}</div>
        <div class="btn-row"><button class="btn-sm" data-editplan="${h.id}">Edit Feeding Plan</button><button class="btn-sm" data-feeddetail="${h.id}">Full Feed Details →</button></div>
      </div>`;
  }).join('');

  const invRows = STATE.inventory.items.map(it=>{
    const use = dailyUsage(it.name);
    const daysLeft = use>0 ? Math.floor(it.qtyOnHand/use) : null;
    const low = daysLeft!==null && daysLeft<=it.reorderDays;
    return `<div class="card row" data-editinv="${it.id}" style="cursor:pointer;">
      <div><div class="name">${it.name}</div><div class="sub">${it.qtyOnHand} ${it.unit} on hand · ${use} ${it.unit}/day across all horses</div></div>
      <div class="pill ${low?'low':'ok'}">${daysLeft!==null? daysLeft+' DAYS' : 'N/A'}</div>
    </div>`;
  }).join('');

  const criticalNow = STATE.horses.filter(h=>STATE.horseData[h.id].preparedBags.daysRemaining<3);
  return `
    ${criticalNow.length ? `
    <div class="loud-alert">
      <div class="loud-alert-icon">⚠️</div>
      <div class="loud-alert-text">${criticalNow.map(h=>`${h.name}: ${STATE.horseData[h.id].preparedBags.daysRemaining}d left`).join(' · ')}
        <div class="loud-alert-sub">Prep more bags before this hits zero.</div>
      </div>
    </div>` : ''}
    <div class="section-label">— Prepared Bags at the Barn — <span class="add-link">${fmtDate(today)}</span></div>
    ${bagRows}
    <div class="banner">Prepared bags debit by 1 day automatically each day, whether or not anyone logs a feeding. When you drop a fresh batch at the barn, tap "Prep More" — that's the only thing that pulls from raw backstock below.</div>
    <div class="section-label">— Raw Backstock — <span class="add-link" id="addInv">+ Add Item</span></div>
    ${invRows || '<div class="empty">No inventory items yet.</div>'}
  `;
}
function attachFeedHandlers(){
  document.querySelectorAll('.skip-toggle').forEach(cb=>cb.addEventListener('change', async e=>{
    const hd = STATE.horseData[e.target.dataset.horse];
    hd.skipDates = hd.skipDates || [];
    const today = todayStr();
    if(e.target.checked){ if(!hd.skipDates.includes(today)) hd.skipDates.push(today); }
    else { hd.skipDates = hd.skipDates.filter(d=>d!==today); }
    await sSet('horse-data:'+e.target.dataset.horse, hd);
  }));
  document.querySelectorAll('[data-prep]').forEach(b=>b.addEventListener('click', ()=>openPrepBagsModal(b.dataset.prep)));
  document.querySelectorAll('[data-editplan]').forEach(b=>b.addEventListener('click', ()=>openEditFeedingPlan(b.dataset.editplan)));
  document.querySelectorAll('[data-feeddetail]').forEach(b=>b.addEventListener('click', ()=>{ ACTIVE_HORSE=b.dataset.feeddetail; renderScreen(); }));
  document.querySelectorAll('[data-editinv]').forEach(c=>c.addEventListener('click', ()=>openEditInventoryItem(c.dataset.editinv)));
  const addInv = document.getElementById('addInv'); if(addInv) addInv.addEventListener('click', openAddInventoryItem);
}

function openPrepBagsModal(horseId){
  showModal(`
    <h3>Prep Bags</h3>
    <label>Horse</label>
    <select id="pb-horse">${STATE.horses.map(h=>`<option value="${h.id}" ${h.id===horseId?'selected':''}>${h.name}</option>`).join('')}</select>
    <label>Days worth to prepare</label>
    <input type="number" inputmode="decimal" id="pb-days" value="7" min="1">
    <div id="pb-recipe" class="card" style="margin-top:10px;"></div>
    <div id="pb-preview" class="sub" style="margin-top:10px;"></div>
    <div class="btn-row"><button class="btn btn-primary" id="pb-save">Prep & Deduct from Backstock</button></div>
    <div id="pb-result"></div>
  `);
  function updatePreview(){
    const hId = document.getElementById('pb-horse').value;
    const days = parseFloat(document.getElementById('pb-days').value)||0;
    const hd = STATE.horseData[hId];
    document.getElementById('pb-recipe').innerHTML = `
      <div class="name" style="margin-bottom:4px;">Recipe — each single AM bag / each single PM bag</div>
      ${renderFeedRecipe(hd.feedingPlan)}
      ${(hd.transitions||[]).some(t=>t.status==='active') ? `<div class="sub" style="margin-top:8px; color:#8C2F2F;">⚠ Active feed transition on this horse — this recipe is today's ratio only. If your prep window crosses a weekly step-up date, portion those later bags separately once the amount updates.</div>` : ''}
    `;
    const items = [...(hd.feedingPlan.AM||[]), ...(hd.feedingPlan.PM||[])];
    const needed = {};
    items.forEach(it=>{ needed[it.name] = (needed[it.name]||0) + it.amt*days; });
    document.getElementById('pb-preview').innerHTML = `Backstock needed for ${days} days: ` + Object.keys(needed).map(n=>`${n} (${needed[n].toFixed(2)})`).join(', ');
  }
  document.getElementById('pb-horse').addEventListener('change', updatePreview);
  document.getElementById('pb-days').addEventListener('input', updatePreview);
  updatePreview();
  document.getElementById('pb-save').addEventListener('click', async ()=>{
    const hId = document.getElementById('pb-horse').value;
    const days = parseFloat(document.getElementById('pb-days').value)||0;
    const result = await prepBags(hId, days);
    if(!result.ok){
      document.getElementById('pb-result').innerHTML = `<div class="banner" style="background:#8C2F2F;">Not enough backstock for: ${result.shortfalls.join(', ')}. Add stock first.</div>`;
    } else {
      closeModal(); renderScreen();
    }
  });
}

function attachReportsOverviewHandlers(){
  const preview = document.getElementById('rep-photo-preview');

  let photoData = null;
  preview.addEventListener('click', ()=>input.click());
  input.addEventListener('change', async ()=>{
    if(input.files[0]){ photoData = await compressImage(input.files[0]); preview.style.backgroundImage = `url(${photoData})`; preview.textContent=''; }
  });
  document.getElementById('rep-generate').addEventListener('click', async (e)=>{
    const horseId = document.getElementById('rep-horse').value;
    const notes = document.getElementById('rep-notes').value.trim();
    const btn = e.target;
    btn.innerHTML = '<span class="spinner"></span>Generating...'; btn.disabled = true;
    try{
      const result = await generateAIReport(horseId, photoData, notes);
      const hd = STATE.horseData[horseId];
      hd.aiReports = hd.aiReports || [];
      const report = { id:uid(), date: todayStr(), photo: photoData, notes, assessment: result.assessment, trainerQuestions: result.trainerQuestions||[], vetQuestions: result.vetQuestions||[], farrierQuestions: result.farrierQuestions||[], bodyworkQuestions: result.bodyworkQuestions||[] };
      hd.aiReports.push(report);
      // feed into training notes journal too
      hd.trainingNotes = hd.trainingNotes || [];
      hd.trainingNotes.push({ id:uid(), date: todayStr(), author:'AI Report', content: result.assessment, source:'ai-report' });
      // feed photo into the visual timeline too, if one was provided
      if(photoData){
        hd.photoLog = hd.photoLog || [];
        hd.photoLog.push({ id:uid(), date: todayStr(), photo: photoData, caption:'AI Progress Report' });
      }
      await sSet('horse-data:'+horseId, hd);
      renderScreen();
    }catch(err){
      alert('Report generation failed: '+err.message);
      btn.textContent='Generate AI Report'; btn.disabled=false;
    }
  });
  document.querySelectorAll('[data-mailto]').forEach(tag=>tag.addEventListener('click', ()=>openQuestionsShare(tag.dataset.horse, tag.dataset.report, tag.dataset.role)));
}
function openQuestionsShare(horseId, reportId, role){
  const hd = STATE.horseData[horseId];
  const h = STATE.horses.find(x=>x.id===horseId);
  const report = hd.aiReports.find(r=>r.id===reportId);
  const qKey = role+'Questions';
  const questions = report[qKey] || [];
  const contact = STATE.contacts[role];
  const body = `Hi${contact&&contact.name?' '+contact.name:''},\n\nFollowing ${h.name}'s latest progress check-in, a few questions:\n\n${questions.map((q,i)=>`${i+1}. ${q}`).join('\n')}\n\nThanks,\nLauren`;
  const subject = `${h.name} — Progress Check-in Questions`;
  const mailto = `mailto:${contact&&contact.email?contact.email:''}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  showModal(`
    <h3>Questions for ${ROLE_LABELS[role]}</h3>
    <div class="card"><div class="report-body">${body.replace(/\n/g,'<br>')}</div></div>
    <div class="btn-row">
      <a class="btn btn-primary" style="text-decoration:none; text-align:center;" href="${mailto}">Open in Mail</a>
    </div>
    <div class="btn-row"><button class="btn btn-secondary" id="copyQ">Copy to Clipboard</button></div>
  `);
  document.getElementById('copyQ').addEventListener('click', ()=>{
    navigator.clipboard.writeText(body).then(()=>alert('Copied!'));
  });
}

/* ============================= REQUEST UPDATE MODAL ============================= */
function openRequestModal(defaultHorseId, defaultRole, lockRole){
  showModal(`
    <h3>Request Care Team Update</h3>
    <label>Horse</label>
    <select id="rq-horse">${STATE.horses.map(h=>`<option value="${h.id}" ${h.id===defaultHorseId?'selected':''}>${h.name}</option>`).join('')}</select>
    ${lockRole ? `
      <label>Role</label>
      <div class="sub" style="margin-bottom:4px;">${ROLE_LABELS[defaultRole]}</div>
      <input type="hidden" id="rq-role" value="${defaultRole}">
    ` : `
      <label>Role</label>
      <select id="rq-role">
        <option value="trainer" ${defaultRole==='trainer'?'selected':''}>Trainer</option>
        <option value="vet" ${defaultRole==='vet'?'selected':''}>Vet</option>
        <option value="farrier" ${defaultRole==='farrier'?'selected':''}>Farrier</option>
        <option value="bodywork" ${defaultRole==='bodywork'?'selected':''}>Bodywork</option>
      </select>
    `}
    <div id="rq-preview" class="sub" style="margin-top:10px;"></div>
    <div class="btn-row"><button class="btn btn-primary" id="rq-create">Generate Request Link</button></div>
    <div id="rq-result"></div>
  `);
  function updatePreview(){
    const horseId = document.getElementById('rq-horse').value;
    const role = document.getElementById('rq-role').value;
    const h = STATE.horses.find(x=>x.id===horseId);
    const qs = templateQuestions(role, h.name);
    document.getElementById('rq-preview').innerHTML = qs.map(q=>'• '+q).join('<br>');
  }
  document.getElementById('rq-horse').addEventListener('change', updatePreview);
  if(!lockRole) document.getElementById('rq-role').addEventListener('change', updatePreview);
  updatePreview();
  document.getElementById('rq-create').addEventListener('click', async ()=>{
    const horseId = document.getElementById('rq-horse').value;
    const role = document.getElementById('rq-role').value;
    const h = STATE.horses.find(x=>x.id===horseId);
    const questions = templateQuestions(role, h.name);
    const req = { id: uid(), horseId, horseName:h.name, role, questions, status:'pending', response:null, createdAt: todayStr() };
    STATE.requests.push(req);
    await sSet('requests', STATE.requests);
    const link = `${location.origin}${location.pathname}?respond=${req.id}`;
    const contact = STATE.contacts[role];
    const body = `Hi${contact&&contact.name?' '+contact.name:''},\n\nCould you give a quick update on ${h.name} using this link? It only takes a minute:\n${link}\n\nThanks,\nLauren`;
    const mailto = `mailto:${contact&&contact.email?contact.email:''}?subject=${encodeURIComponent(h.name+' — Update Request')}&body=${encodeURIComponent(body)}`;
    document.getElementById('rq-result').innerHTML = `
      <div class="link-box">${link}</div>
      <div class="btn-row"><a class="btn btn-primary" style="text-decoration:none; text-align:center;" href="${mailto}">Open in Mail</a></div>
      <div class="btn-row"><button class="btn btn-secondary" id="rq-copy">Copy Link + Message</button></div>
    `;
    document.getElementById('rq-copy').addEventListener('click', ()=>navigator.clipboard.writeText(body).then(()=>alert('Copied!')));
  });
}

/* ============================= DIRECT RESPONSE SCREEN ============================= */
function renderRespondScreen(){
  const req = STATE.requests.find(r=>r.id===RESPOND_MODE.requestId);
  if(!req) return `<div style="padding:40px 20px; font-family:Archivo,sans-serif;">Request not found or no longer valid.</div>`;
  if(req.status==='completed') return `<div style="padding:40px 20px; font-family:Archivo,sans-serif; text-align:center;">
    <div class="brand" style="color:#1F2E23;">Already submitted — thank you!</div>
  </div>`;
  return `
    <div class="topbar"><div class="brand">STA<span>BLE</span></div><div class="sub">${ROLE_LABELS[req.role].toUpperCase()} UPDATE</div></div>
    <div class="screen">
      <div class="section-label">— ${req.horseName} —</div>
      <div class="card">
        ${req.questions.map((q,i)=>`<label>${i+1}. ${q}</label><textarea class="respond-answer" data-idx="${i}"></textarea>`).join('')}
        <div class="btn-row"><button class="btn btn-primary" id="respond-submit">Submit Update</button></div>
      </div>
    </div>
  `;
}
function attachRespondHandlers(){
  const btn = document.getElementById('respond-submit');
  if(!btn) return;
  btn.addEventListener('click', async ()=>{
    const req = STATE.requests.find(r=>r.id===RESPOND_MODE.requestId);
    const answers = Array.from(document.querySelectorAll('.respond-answer')).map((ta,i)=>`${req.questions[i]}\n${ta.value.trim()||'(no answer)'}`).join('\n\n');
    req.status = 'completed'; req.response = answers; req.respondedAt = todayStr();
    await sSet('requests', STATE.requests);
    const hd = STATE.horseData[req.horseId] || emptyHorseData();
    hd.trainingNotes = hd.trainingNotes || [];
    hd.trainingNotes.push({ id:uid(), date: todayStr(), author: ROLE_LABELS[req.role], content: answers, source:'direct-response' });
    await sSet('horse-data:'+req.horseId, hd);
    document.getElementById('app').innerHTML = `<div style="padding:60px 20px; text-align:center; font-family:'Roboto Slab',serif; color:#1F2E23; font-size:20px;">Thank you! Your update has been recorded.</div>`;
  });
}

/* ============================= SETTINGS TAB ============================= */
function renderSettings(){
  const c = STATE.contacts;
  function contactCard(role){
    const info = c[role];
    return `<div class="card">
      <div class="name">${ROLE_LABELS[role]}</div>
      <div class="sub">${info? `${info.name||''} ${info.email?'· '+info.email:''} ${info.phone?'· '+info.phone:''}` : 'Not set'}</div>
      <div class="btn-row"><button class="btn-sm" data-editrole="${role}">Edit</button></div>
    </div>`;
  }
  return `
    <div class="section-label">— Contacts —</div>
    ${contactCard('trainer')}${contactCard('vet')}${contactCard('farrier')}${contactCard('bodywork')}
    ${(c.custom||[]).map((cu,i)=>`<div class="card"><div class="name">${cu.role}</div><div class="sub">${cu.name||''} ${cu.email?'· '+cu.email:''}</div></div>`).join('')}
    <button class="btn btn-secondary" id="addCustomContact">+ Add Custom Contact</button>

    ${!SYNC_OK ? `<div class="banner" style="background:#8C2F2F;">Some changes may not have saved. <span id="retrySyncBtn" style="text-decoration:underline; cursor:pointer;">Tap to retry</span></div>` : ''}

    <div class="section-label">— Anthropic API Key —</div>
    <div class="card">
      <div class="sub">Needed for AI Reports and label scanning. This key is stored only on this device (never sent anywhere except directly to Anthropic), and usage is billed to your own Anthropic account.</div>
      <div class="sub" style="margin-top:6px;">${STATE.apiKey ? `Current key: sk-...${STATE.apiKey.slice(-4)}` : 'No key set yet.'}</div>
      <label>Paste your key</label>
      <input type="text" id="apiKeyInput" placeholder="sk-ant-..." value="">
      <div class="btn-row"><button class="btn btn-primary" id="saveApiKeyBtn">Save Key</button></div>
      <div class="sub" style="margin-top:8px;">Get a key at <strong>console.anthropic.com</strong> → API Keys → Create Key.</div>
    </div>

    <div class="section-label">— Backup & Restore —</div>
    <div class="card">
      <div class="sub">${STATE.lastBackupDate ? `Last backup: ${fmtDate(STATE.lastBackupDate)}${daysBetween(STATE.lastBackupDate, todayStr())>14?' — overdue, back up soon':''}` : 'No backup taken yet — download one now.'}</div>
      <div class="btn-row"><button class="btn btn-primary" id="downloadBackupBtn">Download Backup (.json)</button></div>
      <div class="sub" style="margin-top:10px;">Save that file somewhere off this app — email it to yourself, Google Drive, iCloud, wherever. It's the only copy that survives if something goes wrong with the app itself.</div>
    </div>
    <div class="card">
      <div class="name" style="margin-bottom:6px;">Restore from Backup</div>
      <div class="sub">Loading a backup file replaces all current data in the app. Use this if data was lost or you're setting up on a new link.</div>
      <input type="file" accept="application/json" id="restoreFileInput" style="display:none;">
      <div class="btn-row"><button class="btn-sm" id="restoreBackupBtn" style="color:#8C2F2F;">Restore from File...</button></div>
    </div>
    <div id="backupResult"></div>

    <div class="section-label">— Barn Export —</div>
    <div class="card">
      <div class="sub">Generates a simplified, shareable snapshot of today's bag prep and inventory levels for barn staff — no vet notes or AI reports included.</div>
      <div class="btn-row"><button class="btn btn-primary" id="genExport">Generate Barn Export</button></div>
    </div>
    <div id="exportResult"></div>
  `;
}
function attachSettingsHandlers(){
  document.querySelectorAll('[data-editrole]').forEach(b=>b.addEventListener('click', ()=>openEditContact(b.dataset.editrole)));
  document.getElementById('addCustomContact').addEventListener('click', openAddCustomContact);
  document.getElementById('genExport').addEventListener('click', generateBarnExport);
  document.getElementById('saveApiKeyBtn').addEventListener('click', async ()=>{
    const val = document.getElementById('apiKeyInput').value.trim();
    if(!val) return alert('Paste a key first.');
    STATE.apiKey = val;
    await sSet('anthropic-api-key', STATE.apiKey);
    renderScreen();
  });
  document.getElementById('downloadBackupBtn').addEventListener('click', async ()=>{
    await downloadBackup();
    document.getElementById('backupResult').innerHTML = `<div class="banner">Backup downloaded — save it somewhere off this app.</div>`;
    renderScreen();
  });
  const restoreBtn = document.getElementById('restoreBackupBtn');
  const restoreInput = document.getElementById('restoreFileInput');
  restoreBtn.addEventListener('click', ()=>restoreInput.click());
  restoreInput.addEventListener('change', async ()=>{
    if(!restoreInput.files[0]) return;
    if(!confirm('This will replace ALL current data in the app with the contents of this backup file. This cannot be undone. Continue?')) return;
    try{
      await restoreFromBackupFile(restoreInput.files[0]);
      document.getElementById('backupResult').innerHTML = `<div class="banner">Restored successfully.</div>`;
      ACTIVE_HORSE = null;
      render();
    }catch(err){
      document.getElementById('backupResult').innerHTML = `<div class="banner" style="background:#8C2F2F;">${err.message}</div>`;
    }
  });
  const retryBtn = document.getElementById('retrySyncBtn');
  if(retryBtn) retryBtn.addEventListener('click', async ()=>{
    retryBtn.textContent = 'Retrying...';
    await sSet('horses-roster', STATE.horses);
    await sSet('inventory', STATE.inventory);
    await sSet('contacts', STATE.contacts);
    await sSet('requests', STATE.requests);
    for(const h of STATE.horses) await sSet('horse-data:'+h.id, STATE.horseData[h.id]);
    renderScreen();
  });
}
function openEditContact(role){
  const info = STATE.contacts[role] || {};
  showModal(`
    <h3>Edit ${ROLE_LABELS[role]}</h3>
    <label>Name</label><input type="text" id="c-name" value="${info.name||''}">
    <label>Email</label><input type="email" id="c-email" value="${info.email||''}">
    <label>Phone</label><input type="tel" id="c-phone" value="${info.phone||''}">
    <div class="btn-row"><button class="btn btn-primary" id="c-save">Save Contact</button></div>
  `);
  document.getElementById('c-save').addEventListener('click', async ()=>{
    STATE.contacts[role] = { name:document.getElementById('c-name').value.trim(), email:document.getElementById('c-email').value.trim(), phone:document.getElementById('c-phone').value.trim() };
    await sSet('contacts', STATE.contacts);
    closeModal(); renderScreen();
  });
}
function openAddCustomContact(){
  showModal(`
    <h3>Add Custom Contact</h3>
    <label>Role / Title</label><input type="text" id="cc-role">
    <label>Name</label><input type="text" id="cc-name">
    <label>Email</label><input type="email" id="cc-email">
    <div class="btn-row"><button class="btn btn-primary" id="cc-save">Save</button></div>
  `);
  document.getElementById('cc-save').addEventListener('click', async ()=>{
    STATE.contacts.custom = STATE.contacts.custom || [];
    STATE.contacts.custom.push({ role:document.getElementById('cc-role').value.trim(), name:document.getElementById('cc-name').value.trim(), email:document.getElementById('cc-email').value.trim() });
    await sSet('contacts', STATE.contacts);
    closeModal(); renderScreen();
  });
}
function generateBarnExport(){
  const today = todayStr();
  let text = `STABLE — Barn Export (${fmtDate(today)})\n\n`;
  STATE.horses.forEach(h=>{
    const hd = STATE.horseData[h.id];
    const skipped = (hd.skipDates||[]).includes(today);
    text += `${h.name}${skipped?' (SKIP TODAY)':''} — Bags at barn: ${hd.preparedBags.daysRemaining} days left${hd.preparedBags.daysRemaining<3?' ⚠ NEEDS RESTOCK':''}\n`;
    text += `  AM: ${(hd.feedingPlan.AM||[]).map(i=>`${i.name} ${i.amt}${i.unit}`).join(', ')||'—'}\n`;
    text += `  PM: ${(hd.feedingPlan.PM||[]).map(i=>`${i.name} ${i.amt}${i.unit}`).join(', ')||'—'}\n\n`;
  });
  text += `Raw Backstock Levels:\n`;
  STATE.inventory.items.forEach(it=>{ text += `  ${it.name}: ${it.qtyOnHand} ${it.unit} on hand\n`; });
  document.getElementById('exportResult').innerHTML = `
    <div class="card"><div class="report-body">${text.replace(/\n/g,'<br>')}</div>
    <div class="btn-row"><button class="btn btn-secondary" id="copyExport">Copy</button></div></div>
  `;
  document.getElementById('copyExport').addEventListener('click', ()=>navigator.clipboard.writeText(text).then(()=>alert('Copied!')));
}

/* ============================= MODAL HELPERS ============================= */
function showModal(html){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'modalOverlay';
  overlay.innerHTML = `<div class="modal"><div class="modal-head"><button class="close" id="modalClose">✕</button></div>${html}</div>`;
  document.body.appendChild(overlay);
  document.getElementById('modalClose').addEventListener('click', closeModal);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) closeModal(); });
}
function closeModal(){ const o = document.getElementById('modalOverlay'); if(o) o.remove(); }

/* ============================= BOOT ============================= */
(async function boot(){
  const params = new URLSearchParams(location.search);
  const respondId = params.get('respond');
  document.getElementById('app').innerHTML = `<div style="padding:60px 20px; text-align:center; color:#F6F3EA; font-family:'JetBrains Mono',monospace;">Loading Stable...</div>`;
  await loadAll();
  if(respondId){ RESPOND_MODE = {requestId: respondId}; }
  render();
})();
</script>
